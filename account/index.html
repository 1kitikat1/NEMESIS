<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nemesis — Account</title><link rel="stylesheet" href="/assets/style.css"></head><body><header class="nav"><a class="brand" href="/"><img src="/assets/nemesis-mark.png">NEMESIS</a><nav class="navlinks"><a class="" href="/">Главная</a><a class="" href="/minecraft/">Minecraft</a><a class="" href="/ai/">AI</a><a class="" href="/steam/">Steam</a><a class="" href="/pricing/">Тарифы</a><a class="" href="/support/">Поддержка</a></nav><a class="account" href="/account/">Аккаунт →</a></header><main class="page"><div class="wrap"><div class="panel">
<div class="pagehead"><div class="kicker">ACCOUNT</div><h1>Твой <span class="grad">аккаунт.</span></h1><p>Регистрация сохраняет username, email, тариф и дату создания в Firebase Realtime Database.</p></div>
<div class="form" id="authBox"><div class="tabs"><button class="tab active" id="lt">Войти</button><button class="tab" id="rt">Регистрация</button></div>
<form id="lf"><div class="field"><label>Email</label><input id="le" type="email" required></div><div class="field"><label>Пароль</label><input id="lp" type="password" required></div><button class="btn primary" style="width:100%">Войти</button><div class="status" id="ls"></div></form>
<form id="rf" style="display:none"><div class="field"><label>Имя пользователя</label><input id="ru" minlength="3" required></div><div class="field"><label>Email</label><input id="re" type="email" required></div><div class="field"><label>Пароль</label><input id="rp" type="password" minlength="6" required></div><div class="field"><label>Повтор пароля</label><input id="rr" type="password" minlength="6" required></div><button class="btn primary" style="width:100%">Создать аккаунт</button><div class="status" id="rs"></div></form></div>
<div id="profileBox" style="display:none"><div class="profile"><div class="info"><small>Имя пользователя</small><b id="pn">—</b></div><div class="info"><small>Email</small><b id="pe">—</b></div><div class="info"><small>Тариф</small><b id="pr">FREE</b></div><div class="info"><small>Уникальный ID пользователя</small><b id="pu" style="font-size:10px;word-break:break-all">—</b></div></div><button id="lo" class="btn glass" style="margin:30px">Выйти</button></div>
</div></div></main>
<script type="module">
import{auth,onAuthStateChanged,registerAccount,loginAccount,logoutAccount,getProfile}from"/assets/firebase.js";
const $=x=>document.getElementById(x);
lt.onclick=()=>{lt.classList.add("active");rt.classList.remove("active");lf.style.display="block";rf.style.display="none"};
rt.onclick=()=>{rt.classList.add("active");lt.classList.remove("active");lf.style.display="none";rf.style.display="block"};
lf.onsubmit=async e=>{e.preventDefault();ls.textContent="Вход...";try{await loginAccount(le.value,lp.value);ls.textContent=""}catch(x){ls.textContent="❌ "+x.message}};
rf.onsubmit=async e=>{e.preventDefault();rs.textContent="Создание аккаунта...";if(rp.value!==rr.value){rs.textContent="❌ Пароли не совпадают";return}try{await registerAccount(ru.value,re.value,rp.value);rs.textContent="✅ Аккаунт создан"}catch(x){rs.textContent="❌ "+x.message}};
lo.onclick=()=>logoutAccount();
onAuthStateChanged(auth,async u=>{if(!u){authBox.style.display="block";profileBox.style.display="none";return}let d=await getProfile(u);authBox.style.display="none";profileBox.style.display="block";pn.textContent=d.username||u.displayName;pe.textContent=u.email;pr.textContent=d.role||"free";pu.textContent=u.uid});
</script><footer><div class="wrap foot"><span>© 2026 NEMESIS</span><div class="links"><a href="/support/">Поддержка</a><a href="/account/">Аккаунт</a><a href="https://t.me/Nemesissup">Telegram</a></div></div></footer></body></html>
