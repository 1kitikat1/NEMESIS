<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nemesis AI — Аккаунт</title>
    <meta name="theme-color" content="#07070d" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #07070d;
            font-family: 'Inter', sans-serif;
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            width: 100%;
            padding: 20px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            margin-bottom: 20px;
        }
        .logo {
            font-size: 24px;
            font-weight: 800;
            background: linear-gradient(135deg, #6c63ff, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .back-btn {
            color: #8899bb;
            text-decoration: none;
            font-size: 13px;
            padding: 6px 14px;
            border-radius: 8px;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.05);
            transition: 0.3s;
        }
        .back-btn:hover { color: #fff; background: rgba(255,255,255,0.06); }
        .profile-card {
            background: rgba(255,255,255,0.02);
            border-radius: 16px;
            padding: 24px;
            border: 1px solid rgba(255,255,255,0.05);
            margin-bottom: 20px;
        }
        .profile-avatar {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: linear-gradient(135deg, #6c63ff, #a78bfa);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 12px;
        }
        .profile-name {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 4px;
        }
        .profile-email {
            color: #8888aa;
            font-size: 14px;
            margin-bottom: 12px;
        }
        .role-badge {
            display: inline-block;
            padding: 4px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        .role-free { background: rgba(255,255,255,0.05); color: #8888aa; }
        .role-elite { background: rgba(108,99,255,0.1); color: #6c63ff; }
        .role-ai_basic { background: rgba(108,99,255,0.15); color: #6c63ff; }
        .role-ai_max { background: rgba(255,215,0,0.1); color: #ffd700; }
        .role-nemesis { background: rgba(255,215,0,0.2); color: #ffd700; box-shadow: 0 0 20px rgba(255,215,0,0.1); }
        .role-lynx { background: rgba(0,200,255,0.2); color: #00ccff; box-shadow: 0 0 20px rgba(0,200,255,0.1); }
        .btn {
            display: block;
            width: 100%;
            padding: 12px;
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 10px;
            background: rgba(255,255,255,0.02);
            color: #fff;
            text-align: left;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
            margin-bottom: 8px;
            font-family: 'Inter', sans-serif;
        }
        .btn:hover { background: rgba(255,255,255,0.05); }
        .btn .icon { margin-right: 10px; }
        .btn-primary { background: #6c63ff !important; border: none !important; text-align: center; font-weight: 600; }
        .btn-primary:hover { background: #7b73ff !important; }
        .btn-danger { color: #ff4455; border-color: rgba(255,68,68,0.1); }
        .btn-danger:hover { background: rgba(255,68,68,0.05); }
        .btn-disabled { opacity: 0.3; cursor: not-allowed; }
        .btn-disabled:hover { background: rgba(255,255,255,0.02); }
        .input-group {
            margin-bottom: 16px;
        }
        .input-group label {
            display: block;
            color: #8888aa;
            font-size: 12px;
            margin-bottom: 4px;
        }
        .input-group input {
            width: 100%;
            padding: 12px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 10px;
            color: #fff;
            font-size: 14px;
            outline: none;
            font-family: 'Inter', sans-serif;
        }
        .input-group input:focus { border-color: #6c63ff; }
        .modal {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: #0d0d1a;
            border-radius: 16px;
            padding: 32px;
            max-width: 400px;
            width: 90%;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .modal-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 16px;
            text-align: center;
        }
        .modal-sub {
            color: #8888aa;
            font-size: 13px;
            text-align: center;
            margin-bottom: 16px;
        }
        .modal-close {
            margin-top: 12px;
            padding: 10px;
            width: 100%;
            background: transparent;
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 8px;
            color: #8888aa;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
        }
        .modal-close:hover { background: rgba(255,255,255,0.03); }
        .key-display {
            background: rgba(0,0,0,0.3);
            padding: 12px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 14px;
            text-align: center;
            color: #6c63ff;
            margin: 12px 0;
            word-break: break-all;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 12px;
        }
        .stat-item {
            background: rgba(255,255,255,0.02);
            padding: 12px;
            border-radius: 8px;
            text-align: center;
        }
        .stat-value {
            font-size: 18px;
            font-weight: 700;
            color: #fff;
        }
        .stat-label {
            font-size: 11px;
            color: #8888aa;
            margin-top: 2px;
        }
        .divider {
            height: 1px;
            background: rgba(255,255,255,0.05);
            margin: 16px 0;
        }
        .info-text {
            color: #8888aa;
            font-size: 13px;
            line-height: 1.6;
        }
        .info-text strong { color: #fff; }
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(11,11,18,0.95);
            color: #fff;
            padding: 12px 24px;
            border-radius: 12px;
            border: 1px solid rgba(108,99,255,0.15);
            font-size: 14px;
            z-index: 9999;
            backdrop-filter: blur(12px);
            animation: fadeUp 0.3s ease;
            max-width: 90%;
            text-align: center;
        }
        .toast.fade-out { opacity: 0; transition: opacity 0.4s ease; }
        @keyframes fadeUp {
            0% { opacity: 0; transform: translateX(-50%) translateY(20px); }
            100% { opacity: 1; transform: translateX(-50%) translateY(0); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <span class="logo">👤 Аккаунт</span>
            <a href="/" class="back-btn">← Главная</a>
        </div>

        <div id="login-section">
            <div class="profile-card" style="text-align:center; padding: 40px;">
                <h2>ВХОД</h2>
                <p style="color: #8888aa; font-size: 14px; margin-bottom: 20px;">Войдите в свой аккаунт</p>
                <div class="input-group">
                    <input type="email" id="login-email" placeholder="Email" />
                </div>
                <div class="input-group">
                    <input type="password" id="login-password" placeholder="Пароль" />
                </div>
                <button class="btn btn-primary" id="login-btn">Войти</button>
                <button class="btn" id="register-toggle" style="text-align:center; margin-top: 8px;">Нет аккаунта? Зарегистрироваться</button>
                <div id="login-status" style="color: #ff4455; margin-top: 12px; font-size: 13px;"></div>
            </div>
        </div>

        <div id="profile-section" style="display:none;">
            <div class="profile-card">
                <div class="profile-avatar" id="avatar">U</div>
                <div class="profile-name" id="display-name">Пользователь</div>
                <div class="profile-email" id="display-email">email@mail.com</div>
                <span class="role-badge" id="display-role">FREE</span>

                <div class="divider"></div>

                <div class="stats-grid">
                    <div class="stat-item">
                        <div class="stat-value" id="stat-tokens">1500</div>
                        <div class="stat-label">Токенов</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="stat-chats">0</div>
                        <div class="stat-label">Чатов</div>
                    </div>
                </div>
            </div>

            <!-- Кнопка активации ключа (для всех) -->
            <button class="btn" onclick="openKeyModal()"><span class="icon">🔑</span> Активировать ключ</button>

            <!-- Генерация ключей (только для NEMESIS) -->
            <div id="generate-section" style="display:none;">
                <button class="btn btn-primary" onclick="generateKey()" style="text-align:center;">
                    <span class="icon">👑</span> Сгенерировать ключ
                </button>
                <p style="color: #8888aa; font-size: 12px; text-align:center; margin-top: 4px;">
                    Только для NEMESIS
                </p>
            </div>

            <!-- Статистика ключей (только для NEMESIS) -->
            <div id="stats-section" style="display:none;">
                <div class="profile-card" style="padding: 16px;">
                    <p style="color: #8888aa; font-size: 12px; text-align:center;">
                        📊 Создано ключей: <strong id="key-total">0</strong> &nbsp;|&nbsp; Использовано: <strong id="key-used">0</strong>
                    </p>
                </div>
            </div>

            <!-- Выход -->
            <button class="btn btn-danger" onclick="logout()"><span class="icon">🚪</span> Выйти</button>
        </div>
    </div>

    <!-- Модалка активации ключа -->
    <div class="modal" id="key-modal">
        <div class="modal-content">
            <div class="modal-title">🔑 Активировать ключ</div>
            <div class="modal-sub">Введите ключ для смены роли</div>
            <div class="input-group">
                <input type="text" id="key-input" placeholder="Введите ключ..." />
            </div>
            <button class="btn btn-primary" id="activate-btn" style="text-align:center;">Активировать</button>
            <button class="modal-close" onclick="closeKeyModal()">✕ Закрыть</button>
            <div id="key-status" style="color: #ff4455; margin-top: 12px; font-size: 13px;"></div>
        </div>
    </div>

    <!-- Модалка генерации ключа -->
    <div class="modal" id="generate-modal">
        <div class="modal-content">
            <div class="modal-title">👑 Новый ключ</div>
            <div class="modal-sub">Ключ создан! Скопируйте его</div>
            <div class="key-display" id="generated-key">------</div>
            <button class="btn btn-primary" onclick="copyKey()" style="text-align:center;">📋 Скопировать</button>
            <button class="modal-close" onclick="closeGenerateModal()">✕ Закрыть</button>
            <div id="generate-status" style="color: #22c55e; margin-top: 12px; font-size: 13px; text-align:center;"></div>
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "firebase/app": "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js",
                "firebase/auth": "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js",
                "firebase/database": "https://www.gstatic.com/firebasejs/11.6.0/firebase-database.js"
            }
        }
    </script>

    <script type="module">
        import { initializeApp } from "firebase/app";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut, updateProfile } from "firebase/auth";
        import { getDatabase, ref, set, get, update, push } from "firebase/database";

        const firebaseConfig = {
            apiKey: "AIzaSyA47KFVXVAXEjIkwCqbkwM7yLUGUco8ov8",
            authDomain: "nemesissteam-13577.firebaseapp.com",
            databaseURL: "https://nemesissteam-13577-default-rtdb.firebaseio.com",
            projectId: "nemesissteam-13577",
            storageBucket: "nemesissteam-13577.firebasestorage.app",
            messagingSenderId: "649763368476",
            appId: "1:649763368476:web:de4e044d4d971168fa79d9"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        // ===== DOM =====
        const loginSection = document.getElementById('login-section');
        const profileSection = document.getElementById('profile-section');
        const loginEmail = document.getElementById('login-email');
        const loginPassword = document.getElementById('login-password');
        const loginStatus = document.getElementById('login-status');
        const loginBtn = document.getElementById('login-btn');
        const registerToggle = document.getElementById('register-toggle');
        const displayName = document.getElementById('display-name');
        const displayEmail = document.getElementById('display-email');
        const displayRole = document.getElementById('display-role');
        const avatar = document.getElementById('avatar');
        const statTokens = document.getElementById('stat-tokens');
        const statChats = document.getElementById('stat-chats');
        const generateSection = document.getElementById('generate-section');
        const statsSection = document.getElementById('stats-section');
        const keyTotal = document.getElementById('key-total');
        const keyUsed = document.getElementById('key-used');

        let currentUser = null;
        let currentUserData = null;
        let isRegister = false;
        let lastGeneratedKey = '';

        // ===== РОЛИ =====
        const ROLE_CONFIG = {
            free: { maxTokens: 1500, label: '🆓 FREE', canGenerate: false },
            elite: { maxTokens: 1500, label: '⚡ ELITE', canGenerate: false },
            ai_basic: { maxTokens: 5000, label: '🧠 AI+', canGenerate: false },
            ai_max: { maxTokens: 5000, label: '🚀 AI MAX', canGenerate: false },
            nemesis: { maxTokens: 5000, label: '👑 NEMESIS', canGenerate: true },
            lynx: { maxTokens: 5000, label: '🐆 LYNX', canGenerate: false },
        };

        const ROLE_CLASSES = {
            free: 'role-free',
            elite: 'role-elite',
            ai_basic: 'role-ai_basic',
            ai_max: 'role-ai_max',
            nemesis: 'role-nemesis',
            lynx: 'role-lynx',
        };

        function getMaxTokens(role) {
            return ROLE_CONFIG[role]?.maxTokens || 1500;
        }

        function getRoleLabel(role) {
            return ROLE_CONFIG[role]?.label || '🆓 FREE';
        }

        function canGenerateKeys(role) {
            return ROLE_CONFIG[role]?.canGenerate || false;
        }

        function showToast(msg) {
            const existing = document.querySelector('.toast');
            if (existing) existing.remove();
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = msg;
            document.body.appendChild(toast);
            setTimeout(() => {
                toast.classList.add('fade-out');
                setTimeout(() => toast.remove(), 500);
            }, 3000);
        }

        // ===== UI =====
        async function updateUI(user, data) {
            if (user && data) {
                currentUser = user;
                currentUserData = data;
                loginSection.style.display = 'none';
                profileSection.style.display = 'block';
                displayName.textContent = data.username || user.displayName || user.email.split('@')[0];
                displayEmail.textContent = user.email;
                avatar.textContent = (data.username || 'U')[0].toUpperCase();

                const role = data.role || 'free';
                displayRole.textContent = getRoleLabel(role);
                displayRole.className = 'role-badge ' + (ROLE_CLASSES[role] || 'role-free');
                statTokens.textContent = getMaxTokens(role);

                // Загружаем количество чатов
                try {
                    const chatsSnap = await get(ref(db, `users/${user.uid}/ai_chats`));
                    const chats = chatsSnap.val();
                    statChats.textContent = chats ? Object.keys(chats).length : 0;
                } catch { statChats.textContent = '0'; }

                // Показываем генерацию ключей только для NEMESIS
                if (canGenerateKeys(role)) {
                    generateSection.style.display = 'block';
                    statsSection.style.display = 'block';
                    await loadKeyStats();
                } else {
                    generateSection.style.display = 'none';
                    statsSection.style.display = 'none';
                }

            } else {
                currentUser = null;
                currentUserData = null;
                loginSection.style.display = 'block';
                profileSection.style.display = 'none';
                loginStatus.textContent = '';
            }
        }

        // ===== СТАТИСТИКА КЛЮЧЕЙ =====
        async function loadKeyStats() {
            try {
                const snapshot = await get(ref(db, 'keys'));
                const data = snapshot.val();
                if (data) {
                    const keys = Object.values(data);
                    keyTotal.textContent = keys.length;
                    keyUsed.textContent = keys.filter(k => k.used).length;
                } else {
                    keyTotal.textContent = '0';
                    keyUsed.textContent = '0';
                }
            } catch {
                keyTotal.textContent = '?';
                keyUsed.textContent = '?';
            }
        }

        // ===== ГЕНЕРАЦИЯ КЛЮЧА =====
        window.generateKey = async function() {
            if (!currentUser || !canGenerateKeys(currentUserData?.role)) {
                showToast('❌ Только NEMESIS могут создавать ключи');
                return;
            }

            const key = 'NEM-' + Math.random().toString(36).substring(2, 8).toUpperCase() + '-' + Math.random().toString(36).substring(2, 6).toUpperCase();
            lastGeneratedKey = key;

            try {
                await set(ref(db, `keys/${key}`), {
                    plan: 'nemesis',
                    used: false,
                    createdBy: currentUser.uid,
                    createdByUsername: currentUserData?.username || 'Unknown',
                    createdAt: new Date().toISOString()
                });

                document.getElementById('generated-key').textContent = key;
                document.getElementById('generate-status').textContent = '✅ Ключ создан!';
                document.getElementById('generate-modal').classList.add('active');
                await loadKeyStats();
                showToast('👑 Ключ создан!');
            } catch (e) {
                document.getElementById('generate-status').textContent = '❌ ' + e.message;
                document.getElementById('generate-status').style.color = '#ff4455';
            }
        };

        window.copyKey = function() {
            if (lastGeneratedKey) {
                navigator.clipboard.writeText(lastGeneratedKey).then(() => {
                    document.getElementById('generate-status').textContent = '📋 Скопировано!';
                    document.getElementById('generate-status').style.color = '#22c55e';
                }).catch(() => {
                    document.getElementById('generate-status').textContent = '❌ Не удалось скопировать';
                });
            }
        };

        function closeGenerateModal() {
            document.getElementById('generate-modal').classList.remove('active');
        }

        // ===== АКТИВАЦИЯ КЛЮЧА =====
        window.openKeyModal = function() {
            document.getElementById('key-modal').classList.add('active');
            document.getElementById('key-status').textContent = '';
            document.getElementById('key-input').value = '';
        };

        window.closeKeyModal = function() {
            document.getElementById('key-modal').classList.remove('active');
        };

        document.getElementById('activate-btn').addEventListener('click', async () => {
            const key = document.getElementById('key-input').value.trim();
            const status = document.getElementById('key-status');
            if (!key) { status.textContent = '❌ Введите ключ'; return; }

            try {
                const snapshot = await get(ref(db, `keys/${key}`));
                const data = snapshot.val();
                if (!data) { status.textContent = '❌ Неверный ключ'; return; }
                if (data.used) { status.textContent = '❌ Ключ уже использован'; return; }

                const role = data.plan || 'free';
                await update(ref(db, `users/${currentUser.uid}`), { role: role });
                await update(ref(db, `keys/${key}`), { used: true, usedBy: currentUser.uid, usedAt: new Date().toISOString() });

                const snapshotUser = await get(ref(db, `users/${currentUser.uid}`));
                const userData = snapshotUser.val();
                await updateUI(currentUser, userData);
                closeKeyModal();
                status.textContent = '✅ Роль обновлена!';
                status.style.color = '#22c55e';
                showToast('✅ Роль обновлена до ' + getRoleLabel(role));
            } catch (e) {
                status.textContent = '❌ ' + e.message;
            }
        });

        // ===== АВТОРИЗАЦИЯ =====
        registerToggle.addEventListener('click', () => {
            isRegister = !isRegister;
            loginBtn.textContent = isRegister ? 'Зарегистрироваться' : 'Войти';
            registerToggle.textContent = isRegister ? 'Уже есть аккаунт? Войти' : 'Нет аккаунта? Зарегистрироваться';
            loginStatus.textContent = '';
        });

        loginBtn.addEventListener('click', async () => {
            const email = loginEmail.value.trim();
            const password = loginPassword.value;
            if (!email || !password) {
                loginStatus.textContent = '❌ Заполните все поля';
                return;
            }
            loginStatus.textContent = '⏳ Обработка...';
            loginStatus.style.color = '#8888aa';

            try {
                if (isRegister) {
                    const username = email.split('@')[0];
                    const cred = await createUserWithEmailAndPassword(auth, email, password);
                    await updateProfile(cred.user, { displayName: username });
                    await set(ref(db, `users/${cred.user.uid}`), {
                        username: username,
                        email: email,
                        role: 'free',
                        createdAt: new Date().toISOString()
                    });
                } else {
                    await signInWithEmailAndPassword(auth, email, password);
                }
                loginEmail.value = '';
                loginPassword.value = '';
            } catch (e) {
                loginStatus.textContent = '❌ ' + e.message;
                loginStatus.style.color = '#ff4444';
            }
        });

        // ===== ВЫХОД =====
        window.logout = async function() {
            await signOut(auth);
        };

        // ===== СОСТОЯНИЕ =====
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const snapshot = await get(ref(db, `users/${user.uid}`));
                const data = snapshot.val() || { role: 'free', username: user.displayName || user.email.split('@')[0] };
                await updateUI(user, data);
            } else {
                await updateUI(null, null);
            }
        });
    </script>
</body>
</html>
