<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nemesis AI — Аккаунт</title>
    <meta name="theme-color" content="#07070d" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #07070d;
            font-family: 'Inter', sans-serif;
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            width: 100%;
            padding: 20px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            margin-bottom: 20px;
        }
        .logo {
            font-size: 24px;
            font-weight: 800;
            background: linear-gradient(135deg, #6c63ff, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .back-btn {
            color: #8899bb;
            text-decoration: none;
            font-size: 13px;
            padding: 6px 14px;
            border-radius: 8px;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.05);
        }
        .profile-card {
            background: rgba(255,255,255,0.02);
            border-radius: 16px;
            padding: 24px;
            border: 1px solid rgba(255,255,255,0.05);
            margin-bottom: 20px;
        }
        .profile-avatar {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: linear-gradient(135deg, #6c63ff, #a78bfa);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 12px;
        }
        .profile-name {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 4px;
        }
        .profile-email {
            color: #8888aa;
            font-size: 14px;
            margin-bottom: 12px;
        }
        .role-badge {
            display: inline-block;
            padding: 4px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        .role-free { background: rgba(255,255,255,0.05); color: #8888aa; }
        .role-elite { background: rgba(108,99,255,0.1); color: #6c63ff; }
        .role-ai_basic { background: rgba(108,99,255,0.15); color: #6c63ff; }
        .role-ai_max { background: rgba(255,215,0,0.1); color: #ffd700; }
        .role-nemesis { background: rgba(255,215,0,0.2); color: #ffd700; box-shadow: 0 0 20px rgba(255,215,0,0.1); }
        .role-lynx { background: rgba(0,200,255,0.2); color: #00ccff; box-shadow: 0 0 20px rgba(0,200,255,0.1); }
        .btn {
            display: block;
            width: 100%;
            padding: 12px;
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 10px;
            background: rgba(255,255,255,0.02);
            color: #fff;
            text-align: left;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
            margin-bottom: 8px;
            font-family: 'Inter', sans-serif;
        }
        .btn:hover { background: rgba(255,255,255,0.05); }
        .btn .icon { margin-right: 10px; }
        .btn-danger { color: #ff4455; border-color: rgba(255,68,68,0.1); }
        .btn-danger:hover { background: rgba(255,68,68,0.05); }
        .input-group {
            margin-bottom: 16px;
        }
        .input-group label {
            display: block;
            color: #8888aa;
            font-size: 12px;
            margin-bottom: 4px;
        }
        .input-group input {
            width: 100%;
            padding: 12px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 10px;
            color: #fff;
            font-size: 14px;
            outline: none;
            font-family: 'Inter', sans-serif;
        }
        .input-group input:focus { border-color: #6c63ff; }
        .modal {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: #0d0d1a;
            border-radius: 16px;
            padding: 32px;
            max-width: 400px;
            width: 90%;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .modal-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 16px;
            text-align: center;
        }
        .modal-close {
            margin-top: 12px;
            padding: 10px;
            width: 100%;
            background: transparent;
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 8px;
            color: #8888aa;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
        }
        .modal-close:hover { background: rgba(255,255,255,0.03); }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <span class="logo">👤 Аккаунт</span>
            <a href="/ai/" class="back-btn">→ Чат</a>
        </div>

        <div id="login-section">
            <div class="profile-card" style="text-align:center; padding: 40px;">
                <h2>ВХОД</h2>
                <p style="color: #8888aa; font-size: 14px; margin-bottom: 20px;">Войдите в свой аккаунт</p>
                <div class="input-group">
                    <input type="email" id="login-email" placeholder="Email" />
                </div>
                <div class="input-group">
                    <input type="password" id="login-password" placeholder="Пароль" />
                </div>
                <button class="btn" id="login-btn" style="text-align:center; background: #6c63ff; border: none; font-weight: 600;">Войти</button>
                <button class="btn" id="register-toggle" style="text-align:center; margin-top: 8px;">Нет аккаунта? Зарегистрироваться</button>
                <div id="login-status" style="color: #ff4455; margin-top: 12px; font-size: 13px;"></div>
            </div>
        </div>

        <div id="profile-section" style="display:none;">
            <div class="profile-card">
                <div class="profile-avatar" id="avatar">U</div>
                <div class="profile-name" id="display-name">Пользователь</div>
                <div class="profile-email" id="display-email">email@mail.com</div>
                <span class="role-badge" id="display-role">FREE</span>
            </div>

            <button class="btn" onclick="openKeyModal()"><span class="icon">🔑</span> Активировать ключ</button>
            <button class="btn" onclick="logout()"><span class="icon">🚪</span> Выйти</button>

            <div style="margin-top: 20px; padding: 16px; background: rgba(255,255,255,0.02); border-radius: 12px; border: 1px solid rgba(255,255,255,0.03);">
                <p style="color: #8888aa; font-size: 12px; text-align: center;">
                    Роль: <strong id="role-text">FREE</strong><br>
                    Токенов: <strong id="token-text">1500</strong>
                </p>
            </div>
        </div>
    </div>

    <div class="modal" id="key-modal">
        <div class="modal-content">
            <div class="modal-title">🔑 Активировать ключ</div>
            <div class="input-group">
                <input type="text" id="key-input" placeholder="Введите ключ..." />
            </div>
            <button class="btn" id="activate-btn" style="text-align:center; background: #6c63ff; border: none; font-weight: 600;">Активировать</button>
            <button class="modal-close" onclick="closeKeyModal()">✕ Закрыть</button>
            <div id="key-status" style="color: #ff4455; margin-top: 12px; font-size: 13px;"></div>
        </div>
    </div>

    <script>
        // ===== FIREBASE =====
        import { initializeApp } from "firebase/app";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut, updateProfile } from "firebase/auth";
        import { getDatabase, ref, set, get, update } from "firebase/database";

        const firebaseConfig = {
            apiKey: "AIzaSyA47KFVXVAXEjIkwCqbkwM7yLUGUco8ov8",
            authDomain: "nemesissteam-13577.firebaseapp.com",
            databaseURL: "https://nemesissteam-13577-default-rtdb.firebaseio.com",
            projectId: "nemesissteam-13577",
            storageBucket: "nemesissteam-13577.firebasestorage.app",
            messagingSenderId: "649763368476",
            appId: "1:649763368476:web:de4e044d4d971168fa79d9"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        // ===== DOM =====
        const loginSection = document.getElementById('login-section');
        const profileSection = document.getElementById('profile-section');
        const loginEmail = document.getElementById('login-email');
        const loginPassword = document.getElementById('login-password');
        const loginStatus = document.getElementById('login-status');
        const loginBtn = document.getElementById('login-btn');
        const registerToggle = document.getElementById('register-toggle');
        const displayName = document.getElementById('display-name');
        const displayEmail = document.getElementById('display-email');
        const displayRole = document.getElementById('display-role');
        const avatar = document.getElementById('avatar');
        const roleText = document.getElementById('role-text');
        const tokenText = document.getElementById('token-text');

        let isRegister = false;
        let currentUser = null;

        // ===== РОЛИ =====
        const ROLE_CONFIG = {
            free: { maxTokens: 1500, label: '🆓 FREE' },
            elite: { maxTokens: 1500, label: '⚡ ELITE' },
            ai_basic: { maxTokens: 5000, label: '🧠 AI+' },
            ai_max: { maxTokens: 5000, label: '🚀 AI MAX' },
            nemesis: { maxTokens: 5000, label: '👑 NEMESIS' },
            lynx: { maxTokens: 5000, label: '🐆 LYNX' },
        };

        const ROLE_CLASSES = {
            free: 'role-free',
            elite: 'role-elite',
            ai_basic: 'role-ai_basic',
            ai_max: 'role-ai_max',
            nemesis: 'role-nemesis',
            lynx: 'role-lynx',
        };

        function getMaxTokens(role) {
            return ROLE_CONFIG[role]?.maxTokens || 1500;
        }

        function getRoleLabel(role) {
            return ROLE_CONFIG[role]?.label || '🆓 FREE';
        }

        // ===== UI =====
        function updateUI(user, data) {
            if (user) {
                currentUser = user;
                loginSection.style.display = 'none';
                profileSection.style.display = 'block';
                displayName.textContent = data.username || user.displayName || user.email.split('@')[0];
                displayEmail.textContent = user.email;
                avatar.textContent = (data.username || 'U')[0].toUpperCase();
                const role = data.role || 'free';
                displayRole.textContent = getRoleLabel(role);
                displayRole.className = 'role-badge ' + (ROLE_CLASSES[role] || 'role-free');
                roleText.textContent = role.toUpperCase();
                tokenText.textContent = getMaxTokens(role);
            } else {
                currentUser = null;
                loginSection.style.display = 'block';
                profileSection.style.display = 'none';
                loginStatus.textContent = '';
            }
        }

        // ===== АВТОРИЗАЦИЯ =====
        registerToggle.addEventListener('click', () => {
            isRegister = !isRegister;
            loginBtn.textContent = isRegister ? 'Зарегистрироваться' : 'Войти';
            registerToggle.textContent = isRegister ? 'Уже есть аккаунт? Войти' : 'Нет аккаунта? Зарегистрироваться';
            loginStatus.textContent = '';
        });

        loginBtn.addEventListener('click', async () => {
            const email = loginEmail.value.trim();
            const password = loginPassword.value;
            if (!email || !password) {
                loginStatus.textContent = '❌ Заполните все поля';
                return;
            }
            loginStatus.textContent = '⏳ Обработка...';
            loginStatus.style.color = '#8888aa';

            try {
                if (isRegister) {
                    const username = email.split('@')[0];
                    const cred = await createUserWithEmailAndPassword(auth, email, password);
                    await updateProfile(cred.user, { displayName: username });
                    await set(ref(db, `users/${cred.user.uid}`), {
                        username: username,
                        email: email,
                        role: 'free',
                        createdAt: new Date().toISOString()
                    });
                } else {
                    await signInWithEmailAndPassword(auth, email, password);
                }
                loginEmail.value = '';
                loginPassword.value = '';
            } catch (e) {
                loginStatus.textContent = '❌ ' + e.message;
                loginStatus.style.color = '#ff4444';
            }
        });

        // ===== АКТИВАЦИЯ КЛЮЧА =====
        function openKeyModal() {
            document.getElementById('key-modal').classList.add('active');
            document.getElementById('key-status').textContent = '';
            document.getElementById('key-input').value = '';
        }
        function closeKeyModal() {
            document.getElementById('key-modal').classList.remove('active');
        }

        document.getElementById('activate-btn').addEventListener('click', async () => {
            const key = document.getElementById('key-input').value.trim();
            const status = document.getElementById('key-status');
            if (!key) { status.textContent = '❌ Введите ключ'; return; }

            try {
                const snapshot = await get(ref(db, `keys/${key}`));
                const data = snapshot.val();
                if (!data) { status.textContent = '❌ Неверный ключ'; return; }
                if (data.used) { status.textContent = '❌ Ключ уже использован'; return; }

                const role = data.plan || 'free';
                await update(ref(db, `users/${currentUser.uid}`), { role: role });
                await update(ref(db, `keys/${key}`), { used: true, usedBy: currentUser.uid, usedAt: new Date().toISOString() });

                const snapshotUser = await get(ref(db, `users/${currentUser.uid}`));
                updateUI(currentUser, snapshotUser.val());
                closeKeyModal();
                status.textContent = '✅ Роль обновлена!';
                status.style.color = '#22c55e';
            } catch (e) {
                status.textContent = '❌ ' + e.message;
            }
        });

        // ===== ВЫХОД =====
        window.logout = async function() {
            await signOut(auth);
        };

        // ===== СОСТОЯНИЕ =====
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const snapshot = await get(ref(db, `users/${user.uid}`));
                const data = snapshot.val() || { role: 'free', username: user.displayName || user.email.split('@')[0] };
                updateUI(user, data);
            } else {
                updateUI(null, {});
            }
        });
    </script>
</body>
</html>
