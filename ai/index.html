        #stars {

            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }
        .star {
            position: absolute;
            width: 2px;
            height: 2px;
            background: #fff;
            border-radius: 50%;
            opacity: 0.6;
            animation: twinkle var(--duration) ease-in-out infinite alternate;

        @keyframes twinkle {

            justify-content: center;

            color: #6c63ff;

        // ===== ТОСТ =====
        function showToast(message) {
            const existing = document.querySelector('.toast');
            if (existing) existing.remove();
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => {
                toast.classList.add('fade-out');
                setTimeout(() => toast.remove(), 500);
            }, 3000);
        }

        // ===== ПОКАЗАТЬ/СКРЫТЬ =====
        function showLogin() {

            loginSection.style.display = 'none';
            chatSection.style.display = 'flex';

        // ===== ФОРМАТИРОВАНИЕ КОДА =====
        function formatCodeBlock(text) {
            const codeRegex = /```(\w+)?\n([\s\S]*?)```/g;
            let formattedText = text;
            formattedText = formattedText.replace(codeRegex, (match, language, code) => {
                const lang = language || 'plaintext';
                return `<div class="code-block">
                    <div class="code-header">
                        <span class="code-lang">${escapeHtml(lang)}</span>
                        <button class="copy-btn" onclick="copyCode(this)">📋 Копировать</button>
                    </div>
                    <pre><code>${escapeHtml(code)}</code></pre>
                </div>`;
            });
            return formattedText;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        window.copyCode = function(btn) {
            const codeBlock = btn.closest('.code-block').querySelector('code');
            const text = codeBlock.textContent;
            navigator.clipboard.writeText(text).then(() => {
                btn.textContent = '✅';
                setTimeout(() => btn.textContent = '📋 Копировать', 2000);
            }).catch(() => {
                const range = document.createRange();
                range.selectNode(codeBlock);
                window.getSelection().removeAllRanges();
                window.getSelection().addRange(range);
                document.execCommand('copy');
                btn.textContent = '✅';
                setTimeout(() => btn.textContent = '📋 Копировать', 2000);
            });
        };

        // ===== ПРАВА =====
        function getUserPermissions(role) {
            const base = {
                canChat: true,
                canUseVision: false,
                maxTokens: 500,
                label: 'FREE',
                provider: 'kodikrouter'
            };

            switch (role) {
                case 'nemesis':
                    return { ...base, canUseVision: true, maxTokens: 4000, provider: 'agnes', label: 'NEMESIS' };
                case 'ai_max':
                    return { ...base, canUseVision: true, maxTokens: 4000, provider: 'agnes', label: 'AI MAX' };
                case 'ai_basic':
                    return { ...base, canUseVision: true, maxTokens: 2000, provider: 'agnes', label: 'AI+' };
                case 'elite':
                    return { ...base, provider: 'kodikrouter', label: 'ELITE' };
                default:
                    return base;
            }
        }

        // ===== ЗАГРУЗКА ФОТО =====
        async function uploadImage(file) {
            const formData = new FormData();
            formData.append('source', file);
            formData.append('format', 'json');

            const response = await fetch('https://freeimage.host/api/1/upload?key=6d207e02198a847aa98d0a2a901485a5', {
                method: 'POST',
                body: formData
            });

            const data = await response.json();
            if (data.status_code === 200) {
                return data.image.url;
            } else {
                throw new Error('Ошибка загрузки фото');
            }
        }

        // ===== STREAMING (ПЕЧАТЬ В РЕАЛЬНОМ ВРЕМЕНИ) =====
        async function streamAgnesAI(messages, maxTokens, imageUrl = null, onChunk) {
            let formattedMessages = [{ role: 'system', content: SYSTEM_PROMPT }, ...messages];
            if (imageUrl) {
                const lastMsg = messages[messages.length - 1];
                formattedMessages = [
                    { role: 'system', content: SYSTEM_PROMPT },
                    ...messages.slice(0, -1),
                    {
                        role: 'user',
                        content: [
                            { type: 'text', text: lastMsg.content },
                            { type: 'image_url', image_url: { url: imageUrl } }
                        ]
                    }
                ];
            }

            const response = await fetch(AGNES_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${AGNES_API_KEY}`
                },
                body: JSON.stringify({
                    model: AGNES_MODEL,
                    messages: formattedMessages,
                    max_tokens: maxTokens,
                    temperature: 0.7,
                    stream: true
                })
            });

            if (!response.ok) {
                throw new Error('Ошибка API');
            }

            const reader = response.body.getReader();
            const decoder = new TextDecoder();
            let buffer = '';

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;

                buffer += decoder.decode(value, { stream: true });
                const lines = buffer.split('\n');
                buffer = lines.pop() || '';

                for (const line of lines) {
                    if (line.startsWith('data: ')) {
                        const data = line.slice(6);
                        if (data === '[DONE]') continue;
                        try {
                            const json = JSON.parse(data);
                            const chunk = json.choices[0]?.delta?.content || '';
                            if (chunk) {
                                onChunk(chunk);
                            }
                        } catch (e) {}
                    }
                }
            }
        }

        async function streamKodikRouterAI(messages, maxTokens, onChunk) {
            const formattedMessages = [{ role: 'system', content: SYSTEM_PROMPT }, ...messages];

            const response = await fetch(KODIKROUTER_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${KODIKROUTER_KEY}`
                },
                body: JSON.stringify({
                    model: FREE_MODEL,
                    messages: formattedMessages,
                    max_tokens: maxTokens,
                    temperature: 0.7,
                    stream: true
                })
            });

            if (!response.ok) {
                throw new Error('Ошибка API');
            }

            const reader = response.body.getReader();
            const decoder = new TextDecoder();
            let buffer = '';

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;

                buffer += decoder.decode(value, { stream: true });
                const lines = buffer.split('\n');
                buffer = lines.pop() || '';

                for (const line of lines) {
                    if (line.startsWith('data: ')) {
                        const data = line.slice(6);
                        if (data === '[DONE]') continue;
                        try {
                            const json = JSON.parse(data);
                            const chunk = json.choices[0]?.delta?.content || '';
                            if (chunk) {
                                onChunk(chunk);
                            }
                        } catch (e) {}
                    }
                }
            }
        }

        // ===== ГЛАВНАЯ ФУНКЦИЯ =====
        async function getAIResponseStream(messages, role, imageUrl = null, onChunk) {
            const perms = getUserPermissions(role);

            try {
                if (perms.provider === 'agnes') {
                    await streamAgnesAI(messages, perms.maxTokens, imageUrl, onChunk);
                } else {
                    await streamKodikRouterAI(messages, perms.maxTokens, onChunk);
                }
            } catch (error) {
                console.error('AI Error:', error);
                throw error;
            }
        }

        // ===== УДАЛЕНИЕ ЧАТА =====
        window.deleteChat = async function(chatId, e) {
            e.stopPropagation();
            if (!currentUser) return;
            if (!confirm('🗑️ Удалить этот чат?')) return;

            try {
                await remove(ref(db, `users/${currentUser.uid}/ai_chats/${chatId}`));
                if (currentChatId === chatId) {
                    currentChatId = null;
                    chatMessages.innerHTML = '<div class="empty">Выберите чат или создайте новый</div>';
                }
                await loadUserChats();
                showToast('Чат удалён');
            } catch (error) {
                console.error(error);
                showToast('Ошибка удаления');
            }
        };

        // ===== АВТОРИЗАЦИЯ =====
        async function updateUI(user) {
            if (user) {
                try {
                    const snapshot = await get(ref(db, `users/${user.uid}`));
                    let data = snapshot.exists() ? snapshot.val() : {};
                    if (!data.role) {
                        const userData = {
                            username: user.displayName || user.email.split('@')[0],
                            email: user.email,
                            role: 'free',
                            createdAt: new Date().toISOString(),
                            ai_chats: {}
                        };
                        await set(ref(db, `users/${user.uid}`), userData);
                        data = userData;
                    }

                    currentUser = user;
                    userName.textContent = data.username || user.displayName || user.email.split('@')[0];
                    userAvatar.textContent = (data.username || 'U')[0].toUpperCase();

                    const role = data.role || 'free';
                    const perms = getUserPermissions(role);
                    userRole.textContent = perms.label;
                    userRole.className = 'role ' + role;

                    showChat();
                    loadUserChats();
                } catch (error) {
                    console.error('Ошибка загрузки:', error);
                }
            } else {
                currentUser = null;
                showLogin();
                authStatus.textContent = '';
            }
        }

        window.handleAuth = async function(event) {
            event.preventDefault();
            const email = authEmail.value.trim();
            const password = authPass.value;
            authStatus.textContent = '⏳ Обработка...';
            authStatus.style.color = '#8888aa';

            try {
                if (isLoginMode) {
                    const userCredential = await signInWithEmailAndPassword(auth, email, password);
                    await updateUI(userCredential.user);
                    authForm.reset();
                } else {
                    const username = regUsername.value.trim();
                    const passwordRepeat = authPassRepeat.value;
                    if (!username || username.length < 3) {
                        authStatus.textContent = '❌ Имя не менее 3 символов!';
                        authStatus.style.color = '#ff4444';
                        return;
                    }
                    if (password.length < 6) {
                        authStatus.textContent = '❌ Пароль не менее 6 символов!';
                        authStatus.style.color = '#ff4444';
                        return;
                    }
                    if (password !== passwordRepeat) {
                        authStatus.textContent = '❌ Пароли не совпадают!';
                        authStatus.style.color = '#ff4444';
                        return;
                    }

                    const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                    const user = userCredential.user;
                    await updateProfile(user, { displayName: username });

                    await set(ref(db, `users/${user.uid}`), {
                        username: username,
                        email: email,
                        role: "free",
                        createdAt: new Date().toISOString(),
                        ai_chats: {}
                    });

                    await updateUI(user);
                    authForm.reset();
                }
            } catch (error) {
                console.error(error);
                let msg = '❌ Ошибка! ';
                switch (error.code) {
                    case 'auth/email-already-in-use': msg += 'Email уже используется.'; break;
                    case 'auth/invalid-email': msg += 'Некорректный email.'; break;
                    case 'auth/user-not-found': msg += 'Пользователь не найден. Зарегистрируйтесь!'; break;
                    case 'auth/wrong-password': msg += 'Неверный пароль.'; break;
                    case 'auth/weak-password': msg += 'Слабый пароль (мин. 6 символов).'; break;
                    default: msg += error.message;
                }
                authStatus.textContent = msg;
                authStatus.style.color = '#ff4444';
            }
        };

        toggleLink.addEventListener('click', () => {
            isLoginMode = !isLoginMode;
            if (isLoginMode) {
                formTitle.textContent = 'ВХОД';
                formSubtitle.textContent = 'ВОЙДИТЕ В СВОЙ АККАУНТ';
                authBtn.textContent = 'ВОЙТИ';
                toggleLink.textContent = 'НЕТ АККАУНТА? ЗАРЕГИСТРИРУЙТЕСЬ';
                regFields.classList.add('hidden');
                regPassRepeat.classList.add('hidden');
                authEmail.placeholder = 'EMAIL';
            } else {
                formTitle.textContent = 'РЕГИСТРАЦИЯ';
                formSubtitle.textContent = 'СОЗДАЙТЕ НОВЫЙ АККАУНТ';
                authBtn.textContent = 'ЗАРЕГИСТРИРОВАТЬСЯ';
                toggleLink.textContent = 'УЖЕ ЕСТЬ АККАУНТ? ВОЙДИТЕ';
                regFields.classList.remove('hidden');
                regPassRepeat.classList.remove('hidden');
                authEmail.placeholder = 'EMAIL (для входа)';
            }
            authStatus.textContent = '';

        window.logout = async function() {
            try {
                await signOut(auth);
                await updateUI(null);
                showToast('Вы вышли из аккаунта');
            } catch (error) {
                console.error(error);
            }
        };

        // ===== ФАЙЛЫ =====
        fileInput.addEventListener('change', function(e) {
            const file = this.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    filePreview.innerHTML = `
                        <img src="${event.target.result}" alt="preview">
                        <span>${file.name}</span>
                        <span class="remove-file" onclick="clearFile()">✕</span>
                    `;
                    filePreview.classList.remove('hidden');
                };
                reader.readAsDataURL(file);
            }
        });

        window.clearFile = function() {
            fileInput.value = '';
            filePreview.innerHTML = '';
            filePreview.classList.add('hidden');
            currentImageUrl = null;
        };

        // ===== ЧАТЫ =====
        async function loadUserChats() {
            if (!currentUser) return;
            try {
                const snapshot = await get(ref(db, `users/${currentUser.uid}/ai_chats`));
                const data = snapshot.val();
                chatListItems.innerHTML = '';
                if (!data || Object.keys(data).length === 0) {
                    chatListItems.innerHTML = '<div class="chat-empty">Нет чатов</div>';
                    return;
                }
                const ids = Object.keys(data).sort((a, b) => data[b].updated_at?.localeCompare(data[a].updated_at) || 0);
                ids.forEach(id => {
                    const chat = data[id];
                    const div = document.createElement('div');
                    div.className = 'chat-item' + (currentChatId === id ? ' active' : '');
                    div.innerHTML = `
                        <span class="title">${chat.title || 'Новый чат'}</span>
                        <span class="count">${chat.messages ? Object.keys(chat.messages).length : 0}</span>
                        <span class="del-chat" onclick="deleteChat('${id}', event)">✕</span>
                    `;
                    div.onclick = () => openChat(id);
                    chatListItems.appendChild(div);
                });
            } catch (error) {
                console.error(error);
            }
        }

        async function openChat(chatId) {
            if (!currentUser) return;
            currentChatId = chatId;
            try {
                const snapshot = await get(ref(db, `users/${currentUser.uid}/ai_chats/${chatId}`));
                const data = snapshot.val();
                if (!data) return;
                chatMessages.innerHTML = '';
                if (data.messages) {
                    const ids = Object.keys(data.messages).sort((a, b) => data.messages[a].timestamp - data.messages[b].timestamp);
                    ids.forEach(id => {
                        const msg = data.messages[id];
                        const div = document.createElement('div');
                        div.className = `message ${msg.role}`;
                        if (msg.role === 'assistant') {
                            div.innerHTML = `
                                <div class="msg-header">Nemesis AI</div>
                                ${formatCodeBlock(msg.content)}
                            `;
                        } else {
                            div.textContent = msg.content;
                        }
                        chatMessages.appendChild(div);
                    });
                } else {
                    chatMessages.innerHTML = '<div class="empty">Нет сообщений</div>';
                }
                chatMessages.scrollTop = chatMessages.scrollHeight;
                document.querySelectorAll('.chat-item').forEach(el => el.classList.remove('active'));
                const items = document.querySelectorAll('.chat-item');
                const index = Array.from(items).findIndex(el => el.onclick && el.onclick.toString().includes(chatId));
                if (index !== -1 && items[index]) items[index].classList.add('active');
            } catch (error) {
                console.error(error);
            }
        }

        window.createNewChat = async function() {
            if (!currentUser) return;
            try {
                const chatId = `chat_${Date.now()}`;
                await set(ref(db, `users/${currentUser.uid}/ai_chats/${chatId}`), {
                    title: 'Новый чат',
                    created_at: new Date().toISOString(),
                    updated_at: new Date().toISOString(),
                    messages: {}
                });
                await loadUserChats();
                await openChat(chatId);
                showToast('Новый чат создан');
            } catch (error) {
                console.error(error);
                showToast('Ошибка создания чата');
            }
        };

        // ===== ОТПРАВКА СООБЩЕНИЯ (С STREAMING) =====
        window.sendMessage = async function() {
            const text = chatInput.value.trim();
            if (!text || !currentUser || !currentChatId || isProcessing) {
                if (!currentUser) showToast('Войдите в аккаунт');
                return;
            }

            const userSnapshot = await get(ref(db, `users/${currentUser.uid}`));
            const userData = userSnapshot.val();
            const role = userData.role || 'free';
            const perms = getUserPermissions(role);

            if (!perms.canChat) {
                showToast('❌ У вас нет прав на использование ИИ. Купите тариф!');
                return;
            }

            const file = fileInput.files[0];
            let imageUrl = currentImageUrl;
            if (file && !perms.canUseVision) {
                showToast('❌ Ваш тариф не поддерживает загрузку фото. Купите AI+ или AI MAX!');
                return;
            }

            if (file && !imageUrl) {
                try {
                    showToast('⏳ Загрузка фото...');
                    imageUrl = await uploadImage(file);
                    currentImageUrl = imageUrl;
                    showToast('✅ Фото загружено!');
                } catch (error) {
                    showToast('❌ Ошибка загрузки фото: ' + error.message);
                    return;
                }
            }

            chatInput.value = '';
            sendBtn.disabled = true;
            isProcessing = true;

            try {
                const msgRef = push(ref(db, `users/${currentUser.uid}/ai_chats/${currentChatId}/messages`));
                await set(msgRef, { role: 'user', content: text, timestamp: Date.now() });
                await update(ref(db, `users/${currentUser.uid}/ai_chats/${currentChatId}`), { updated_at: new Date().toISOString() });

                const snapshot = await get(ref(db, `users/${currentUser.uid}/ai_chats/${currentChatId}/messages`));
                const data = snapshot.val();
                const history = [];
                if (data) {
                    const ids = Object.keys(data).sort((a, b) => data[a].timestamp - data[b].timestamp);
                    ids.forEach(id => {
                        history.push({ role: data[id].role, content: data[id].content });
                    });
                }

                // Создаём сообщение для ответа
                const msgDiv = document.createElement('div');
                msgDiv.className = 'message assistant';
                msgDiv.innerHTML = `<div class="msg-header">Nemesis AI</div><span></span>`;
                chatMessages.appendChild(msgDiv);
                chatMessages.scrollTop = chatMessages.scrollHeight;

                let fullResponse = '';
                const textSpan = msgDiv.querySelector('span');

                await getAIResponseStream(history, role, imageUrl, (chunk) => {
                    fullResponse += chunk;
                    textSpan.innerHTML = formatCodeBlock(fullResponse);
                    chatMessages.scrollTop = chatMessages.scrollHeight;
                });

                // Сохраняем полный ответ в Firebase
                const resRef = push(ref(db, `users/${currentUser.uid}/ai_chats/${currentChatId}/messages`));
                await set(resRef, { role: 'assistant', content: fullResponse, timestamp: Date.now() });

                clearFile();
                currentImageUrl = null;

                await loadUserChats();

            } catch (error) {
                console.error(error);
                const loading = chatMessages.querySelector('.message.assistant.loading');
                if (loading) loading.remove();

                const errorDiv = document.createElement('div');
                errorDiv.className = 'message assistant error';
                errorDiv.innerHTML = `<div class="msg-header">Nemesis AI</div>❌ ${error.message || 'Не удалось получить ответ'}`;
                chatMessages.appendChild(errorDiv);
                chatMessages.scrollTop = chatMessages.scrollHeight;
            } finally {
                sendBtn.disabled = false;
                isProcessing = false;
            }
        };

        // ===== СОСТОЯНИЕ =====
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                await updateUI(user);
            } else {
                await updateUI(null);
            }
        });

        // ===== ЗВЁЗДЫ =====
        function createStars() {
            const container = document.getElementById('stars');
            for (let i = 0; i < 120; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.width = (Math.random() * 2 + 1) + 'px';
                star.style.height = star.style.width;
                star.style.setProperty('--duration', (Math.random() * 3 + 2) + 's');
                star.style.animationDelay = (Math.random() * 5) + 's';
                container.appendChild(star);
            }
        }
        createStars();

        console.log('🚀 Nemesis AI готов к работе!');
        console.log('⭐ Создан командой Kotik Team');
        console.log('🤖 Модели: FREE/ELITE: NVIDIA Nemotron Nano 12B VL | Premium: Agnes-2.0-Flash');
        console.log('📸 Загрузка фото через FreeImage.host');
        console.log('🗑️ Удаление чатов — кнопка ✕');
        console.log('⏳ Печать в реальном времени — включена');
    </script>
