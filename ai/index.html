<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nemesis AI — ИИ чат</title>
    <meta name="theme-color" content="#07070d" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #07070d;
            font-family: 'Inter', sans-serif;
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 20px;
        }

        #stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }
        .star {
            position: absolute;
            width: 2px;
            height: 2px;
            background: #fff;
            border-radius: 50%;
            opacity: 0.6;
            animation: twinkle var(--duration) ease-in-out infinite alternate;
        }
        @keyframes twinkle {
            0% { opacity: 0.2; transform: scale(0.8); }
            100% { opacity: 0.9; transform: scale(1.2); }
        }

        .container {
            width: 100%;
            max-width: 900px;
            position: relative;
            z-index: 5;
            display: flex;
            flex-direction: column;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 0 24px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            margin-bottom: 24px;
        }
        .header .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 20px;
            font-weight: 800;
            color: #fff;
            text-decoration: none;
        }
        .header .logo .icon {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: rgba(108,99,255,0.15);
            border: 1px solid rgba(108,99,255,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: #6c63ff;
        }
        .header .logo span.nemesis {
            background: linear-gradient(135deg, #6c63ff, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .header .back-btn {
            color: #8899bb;
            text-decoration: none;
            font-size: 13px;
            padding: 8px 18px;
            border-radius: 10px;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.05);
            transition: 0.3s;
        }
        .header .back-btn:hover { color: #fff; background: rgba(255,255,255,0.06); }

        .profile-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: rgba(255,255,255,0.025);
            border-radius: 14px;
            border: 1px solid rgba(255,255,255,0.04);
            margin-bottom: 16px;
        }
        .profile-bar .user {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #8899bb;
            font-size: 13px;
        }
        .profile-bar .user .avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: linear-gradient(135deg, #6c63ff, #a78bfa);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 700;
            color: #fff;
        }
        .profile-bar .user .name { color: #fff; font-weight: 600; }
        .profile-bar .role {
            font-size: 11px;
            padding: 4px 14px;
            border-radius: 20px;
        }
        .profile-bar .role.free { background: rgba(255,255,255,0.05); color: #8888aa; }
        .profile-bar .role.elite { background: rgba(108,99,255,0.15); color: #6c63ff; }
        .profile-bar .role.nemesis { background: rgba(255,215,0,0.1); color: #ffd700; }

        .chat-list {
            background: rgba(255,255,255,0.025);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 16px;
            max-height: 200px;
            overflow-y: auto;
        }
        .chat-list .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            border: none;
            padding: 0;
        }
        .chat-list .header span { color: #8888aa; font-size: 13px; }
        .chat-list .header button {
            background: rgba(108,99,255,0.2);
            border: 1px solid rgba(108,99,255,0.25);
            color: #fff;
            padding: 4px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            font-family: 'Inter', sans-serif;
            transition: 0.2s;
        }
        .chat-list .header button:hover { background: rgba(108,99,255,0.3); }
        .chat-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
            margin-bottom: 4px;
        }
        .chat-item:hover { background: rgba(108,99,255,0.05); }
        .chat-item.active { background: rgba(108,99,255,0.08); }
        .chat-item .title { color: #fff; font-size: 13px; }
        .chat-item .count { color: #555566; font-size: 11px; }
        .chat-empty { color: #555566; text-align: center; padding: 12px; }

        .chat-window {
            background: rgba(255,255,255,0.025);
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.05);
            height: 420px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .chat-messages {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
        }
        .chat-messages .empty {
            text-align: center;
            color: #555566;
            padding: 40px 0;
        }
        .message {
            padding: 10px 16px;
            border-radius: 12px;
            margin-bottom: 8px;
            max-width: 85%;
            font-size: 14px;
            line-height: 1.6;
        }
        .message.user {
            background: rgba(108,99,255,0.15);
            margin-left: auto;
            color: #fff;
        }
        .message.assistant {
            background: rgba(255,255,255,0.05);
            color: #ccc;
        }
        .message.assistant.loading { opacity: 0.6; }
        .message.assistant.error { color: #ff4444; background: rgba(255,68,68,0.08); }
        .chat-input-area {
            display: flex;
            gap: 10px;
            padding: 12px;
            border-top: 1px solid rgba(255,255,255,0.05);
        }
        .chat-input-area input {
            flex: 1;
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 12px;
            padding: 12px 16px;
            color: #fff;
            font-size: 14px;
            outline: none;
            font-family: 'Inter', sans-serif;
        }
        .chat-input-area input::placeholder { color: #555566; }
        .chat-input-area input:focus { border-color: #6c63ff; }
        .chat-input-area button {
            background: rgba(108,99,255,0.2);
            border: 1px solid rgba(108,99,255,0.25);
            color: #fff;
            padding: 12px 20px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 18px;
            transition: 0.2s;
            font-family: 'Inter', sans-serif;
        }
        .chat-input-area button:hover { background: rgba(108,99,255,0.3); }
        .chat-input-area button:disabled { opacity: 0.3; cursor: not-allowed; }

        .login-box {
            background: rgba(255,255,255,0.025);
            border-radius: 24px;
            border: 1px solid rgba(255,255,255,0.05);
            padding: 40px;
            max-width: 420px;
            margin: 40px auto;
            text-align: center;
        }
        .login-box h2 { font-size: 24px; margin-bottom: 8px; }
        .login-box .sub { color: #8888aa; font-size: 12px; margin-bottom: 24px; }
        .login-box input {
            width: 100%;
            padding: 14px 16px;
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 12px;
            color: #fff;
            font-size: 14px;
            outline: none;
            font-family: 'Inter', sans-serif;
            margin-bottom: 12px;
        }
        .login-box input:focus { border-color: #6c63ff; }
        .login-box .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, rgba(108,99,255,0.15), rgba(108,99,255,0.05));
            border: 1px solid rgba(108,99,255,0.15);
            border-radius: 60px;
            color: #fff;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: 0.3s;
            font-family: 'Inter', sans-serif;
        }
        .login-box .btn:hover { background: rgba(108,99,255,0.2); }
        .login-box .toggle {
            margin-top: 14px;
            font-size: 13px;
            color: #8888aa;
        }
        .login-box .toggle span { color: #6c63ff; cursor: pointer; font-weight: 600; }
        .login-box .status { margin-top: 12px; font-size: 13px; min-height: 20px; color: #8888aa; }
        .hidden { display: none !important; }

        @media (max-width: 600px) {
            .header .logo { font-size: 17px; }
            .chat-window { height: 300px; }
            .login-box { padding: 24px; margin: 20px auto; }
        }
    </style>
</head>
<body>

    <div id="stars"></div>

    <div class="container">

        <!-- ХЕДЕР -->
        <div class="header">
            <a href="/" class="logo">
                <div class="icon">N</div>
                <span class="nemesis">NEMESIS</span> <span style="color:#6c63ff;">:3</span>
            </a>
            <a href="/" class="back-btn">← На главную</a>
        </div>

        <div id="main-content">

            <!-- НЕ АВТОРИЗОВАН -->
            <div id="login-section">
                <div class="login-box">
                    <h2 id="form-title">ВХОД</h2>
                    <div class="sub" id="form-subtitle">ВОЙДИТЕ В СВОЙ АККАУНТ</div>
                    <form id="auth-form" onsubmit="handleAuth(event)">
                        <div id="reg-fields" class="hidden">
                            <input type="text" id="reg-username" placeholder="ИМЯ ПОЛЬЗОВАТЕЛЯ" autocomplete="off" />
                        </div>
                        <input type="email" id="auth-email" placeholder="EMAIL" required autocomplete="email" />
                        <input type="password" id="auth-pass" placeholder="ПАРОЛЬ" required autocomplete="current-password" />
                        <div id="reg-pass-repeat" class="hidden">
                            <input type="password" id="auth-pass-repeat" placeholder="ПОВТОРИТЕ ПАРОЛЬ" autocomplete="new-password" />
                        </div>
                        <button type="submit" class="btn" id="auth-btn">ВОЙТИ</button>
                    </form>
                    <div class="toggle">
                        <span id="toggle-link">НЕТ АККАУНТА? ЗАРЕГИСТРИРУЙТЕСЬ</span>
                    </div>
                    <div class="status" id="auth-status"></div>
                </div>
            </div>

            <!-- АВТОРИЗОВАН -->
            <div id="chat-section" class="hidden">

                <!-- Профиль -->
                <div class="profile-bar">
                    <div class="user">
                        <div class="avatar" id="user-avatar">👤</div>
                        <span class="name" id="user-name">Пользователь</span>
                    </div>
                    <span class="role" id="user-role">FREE</span>
                    <button onclick="logout()" style="background:rgba(255,0,0,0.05); border:1px solid rgba(255,0,0,0.08); color:#ff4455; padding:4px 14px; border-radius:8px; cursor:pointer; font-size:11px; font-family:'Inter',sans-serif;">Выйти</button>
                </div>

                <!-- Список чатов -->
                <div class="chat-list">
                    <div class="header">
                        <span>📋 Мои чаты</span>
                        <button onclick="createNewChat()">+ Новый</button>
                    </div>
                    <div id="chat-list-items"><div class="chat-empty">Нет чатов</div></div>
                </div>

                <!-- Окно чата -->
                <div class="chat-window">
                    <div class="chat-messages" id="chat-messages">
                        <div class="empty">Начните новый чат или выберите существующий</div>
                    </div>
                    <div class="chat-input-area">
                        <input id="chat-input" type="text" placeholder="Напиши сообщение..." onkeydown="if(event.key==='Enter') sendMessage()">
                        <button id="send-btn" onclick="sendMessage()">📤</button>
                    </div>
                </div>

            </div>

        </div>

    </div>

    <!-- FIREBASE -->
    <script type="importmap">
        {
            "imports": {
                "firebase/app": "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js",
                "firebase/auth": "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js",
                "firebase/database": "https://www.gstatic.com/firebasejs/11.6.0/firebase-database.js"
            }
        }
    </script>

    <script type="module">
        import { initializeApp } from "firebase/app";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, updateProfile, signOut } from "firebase/auth";
        import { getDatabase, ref, set, get, push, update } from "firebase/database";

        const firebaseConfig = {
            apiKey: "AIzaSyA47KFVXVAXEjIkwCqbkwM7yLUGUco8ov8",
            authDomain: "nemesissteam-13577.firebaseapp.com",
            databaseURL: "https://nemesissteam-13577-default-rtdb.firebaseio.com",
            projectId: "nemesissteam-13577",
            storageBucket: "nemesissteam-13577.firebasestorage.app",
            messagingSenderId: "649763368476",
            appId: "1:649763368476:web:de4e044d4d971168fa79d9",
            measurementId: "G-GJ9KHSG65L"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        // ===== OPENROUTER API =====
        const OPENROUTER_API_KEY = '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';
        const AI_MODEL = 'google/gemma-4-31b-it:free';

        // ===== ПЕРЕМЕННЫЕ =====
        let currentUser = null;
        let currentChatId = null;
        let isLoginMode = true;
        let isProcessing = false;

        // ===== DOM =====
        const loginSection = document.getElementById('login-section');
        const chatSection = document.getElementById('chat-section');
        const authStatus = document.getElementById('auth-status');
        const authForm = document.getElementById('auth-form');
        const authBtn = document.getElementById('auth-btn');
        const formTitle = document.getElementById('form-title');
        const formSubtitle = document.getElementById('form-subtitle');
        const toggleLink = document.getElementById('toggle-link');
        const regFields = document.getElementById('reg-fields');
        const regPassRepeat = document.getElementById('reg-pass-repeat');
        const authEmail = document.getElementById('auth-email');
        const regUsername = document.getElementById('reg-username');
        const authPass = document.getElementById('auth-pass');
        const authPassRepeat = document.getElementById('auth-pass-repeat');
        const userName = document.getElementById('user-name');
        const userAvatar = document.getElementById('user-avatar');
        const userRole = document.getElementById('user-role');
        const chatListItems = document.getElementById('chat-list-items');
        const chatMessages = document.getElementById('chat-messages');
        const chatInput = document.getElementById('chat-input');
        const sendBtn = document.getElementById('send-btn');

        // ===== ПОКАЗАТЬ/СКРЫТЬ =====
        function showLogin() {
            loginSection.style.display = 'block';
            chatSection.classList.add('hidden');
        }

        function showChat() {
            loginSection.style.display = 'none';
            chatSection.classList.remove('hidden');
        }

        // ===== ПОДПИСКА =====
        function getSubscription(role) {
            if (role === 'nemesis' || role === 'ai_max') return 'ai_max';
            if (role === 'elite' || role === 'ai_basic') return 'ai_basic';
            return 'free';
        }

        function getMaxTokens(subscription) {
            switch (subscription) {
                case 'ai_max': return 4000;
                case 'ai_basic': return 2000;
                default: return 500;
            }
        }

      // ===== ОТПРАВКА К ИИ (ЧЕРЕЗ РАБОЧИЙ ПРОКСИ) =====
async function getAIResponse(messages, subscription) {
    const maxTokens = getMaxTokens(subscription);

    try {
        // === ИСПОЛЬЗУЕМ corsproxy.io С ПРАВИЛЬНЫМ ФОРМАТОМ ===
        const targetUrl = 'https://openrouter.ai/api/v1/chat/completions';
        const proxyUrl = 'https://corsproxy.io/?' + encodeURIComponent(targetUrl);
        
        const response = await fetch(proxyUrl, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${OPENROUTER_API_KEY}`,
                'HTTP-Referer': 'https://nemesisx.fun',
                'X-Title': 'Nemesis AI'
            },
            body: JSON.stringify({
                model: AI_MODEL,
                messages: messages,
                max_tokens: maxTokens,
                temperature: 0.7
            })
        });

        if (!response.ok) {
            const errorData = await response.text();
            console.error('API Error:', errorData);
            throw new Error('Ошибка API: ' + response.status);
        }

        const data = await response.json();
        return data.choices[0].message.content;

    } catch (error) {
        console.error('AI Error:', error);
        throw error;
    }
}
        // ===== АВТОРИЗАЦИЯ =====
        async function updateUI(user) {
            if (user) {
                try {
                    const snapshot = await get(ref(db, `users/${user.uid}`));
                    let data = snapshot.exists() ? snapshot.val() : {};

                    if (!data.role) {
                        const userData = {
                            username: user.displayName || user.email.split('@')[0],
                            email: user.email,
                            role: 'free',
                            createdAt: new Date().toISOString(),
                            subscription: { free: { active: true } },
                            ai_chats: {}
                        };
                        await set(ref(db, `users/${user.uid}`), userData);
                        data = userData;
                    }

                    currentUser = user;
                    userName.textContent = data.username || user.displayName || user.email.split('@')[0];
                    userAvatar.textContent = (data.username || 'U')[0].toUpperCase();

                    const role = data.role || 'free';
                    userRole.textContent = role.toUpperCase();
                    userRole.className = 'role ' + role;

                    showChat();
                    loadUserChats();

                } catch (error) {
                    console.error('Ошибка загрузки:', error);
                    if (error.code === 'auth/user-not-found') {
                        authStatus.textContent = '❌ Пользователь не найден. Зарегистрируйтесь!';
                        authStatus.style.color = '#ff4444';
                    }
                }
            } else {
                currentUser = null;
                showLogin();
                authStatus.textContent = '';
            }
        }

        window.handleAuth = async function(event) {
            event.preventDefault();
            const email = authEmail.value.trim();
            const password = authPass.value;
            authStatus.textContent = '⏳ Обработка...';
            authStatus.style.color = '#8888aa';

            try {
                if (isLoginMode) {
                    const userCredential = await signInWithEmailAndPassword(auth, email, password);
                    await updateUI(userCredential.user);
                    authForm.reset();
                } else {
                    const username = regUsername.value.trim();
                    const passwordRepeat = authPassRepeat.value;

                    if (!username || username.length < 3) {
                        authStatus.textContent = '❌ Имя не менее 3 символов!';
                        authStatus.style.color = '#ff4444';
                        return;
                    }
                    if (password.length < 6) {
                        authStatus.textContent = '❌ Пароль не менее 6 символов!';
                        authStatus.style.color = '#ff4444';
                        return;
                    }
                    if (password !== passwordRepeat) {
                        authStatus.textContent = '❌ Пароли не совпадают!';
                        authStatus.style.color = '#ff4444';
                        return;
                    }

                    const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                    const user = userCredential.user;
                    await updateProfile(user, { displayName: username });

                    await set(ref(db, `users/${user.uid}`), {
                        username: username,
                        email: email,
                        role: "free",
                        createdAt: new Date().toISOString(),
                        subscription: { free: { active: true } },
                        ai_chats: {}
                    });

                    await updateUI(user);
                    authForm.reset();
                }
            } catch (error) {
                console.error(error);
                let msg = '❌ Ошибка! ';
                switch (error.code) {
                    case 'auth/email-already-in-use': msg += 'Email уже используется.'; break;
                    case 'auth/invalid-email': msg += 'Некорректный email.'; break;
                    case 'auth/user-not-found': msg += 'Пользователь не найден. Зарегистрируйтесь!'; break;
                    case 'auth/wrong-password': msg += 'Неверный пароль.'; break;
                    case 'auth/weak-password': msg += 'Слабый пароль (мин. 6 символов).'; break;
                    default: msg += error.message;
                }
                authStatus.textContent = msg;
                authStatus.style.color = '#ff4444';
            }
        };

        toggleLink.addEventListener('click', () => {
            isLoginMode = !isLoginMode;
            if (isLoginMode) {
                formTitle.textContent = 'ВХОД';
                formSubtitle.textContent = 'ВОЙДИТЕ В СВОЙ АККАУНТ';
                authBtn.textContent = 'ВОЙТИ';
                toggleLink.textContent = 'НЕТ АККАУНТА? ЗАРЕГИСТРИРУЙТЕСЬ';
                regFields.classList.add('hidden');
                regPassRepeat.classList.add('hidden');
                authEmail.placeholder = 'EMAIL';
            } else {
                formTitle.textContent = 'РЕГИСТРАЦИЯ';
                formSubtitle.textContent = 'СОЗДАЙТЕ НОВЫЙ АККАУНТ';
                authBtn.textContent = 'ЗАРЕГИСТРИРОВАТЬСЯ';
                toggleLink.textContent = 'УЖЕ ЕСТЬ АККАУНТ? ВОЙДИТЕ';
                regFields.classList.remove('hidden');
                regPassRepeat.classList.remove('hidden');
                authEmail.placeholder = 'EMAIL (для входа)';
            }
            authStatus.textContent = '';
        });

        window.logout = async function() {
            try {
                await signOut(auth);
                await updateUI(null);
            } catch (error) {
                console.error(error);
            }
        };

        // ===== AI ЧАТ =====
        async function loadUserChats() {
            if (!currentUser) return;
            try {
                const snapshot = await get(ref(db, `users/${currentUser.uid}/ai_chats`));
                const data = snapshot.val();
                chatListItems.innerHTML = '';
                if (!data || Object.keys(data).length === 0) {
                    chatListItems.innerHTML = '<div class="chat-empty">Нет чатов. Создайте новый!</div>';
                    return;
                }
                const ids = Object.keys(data).sort((a, b) => data[b].updated_at?.localeCompare(data[a].updated_at) || 0);
                ids.forEach(id => {
                    const chat = data[id];
                    const div = document.createElement('div');
                    div.className = 'chat-item' + (currentChatId === id ? ' active' : '');
                    div.innerHTML = `<span class="title">${chat.title || 'Новый чат'}</span><span class="count">${chat.messages ? Object.keys(chat.messages).length : 0} сообщ.</span>`;
                    div.onclick = () => openChat(id);
                    chatListItems.appendChild(div);
                });
            } catch (error) {
                console.error(error);
            }
        }

        async function openChat(chatId) {
            if (!currentUser) return;
            currentChatId = chatId;
            try {
                const snapshot = await get(ref(db, `users/${currentUser.uid}/ai_chats/${chatId}`));
                const data = snapshot.val();
                if (!data) return;
                chatMessages.innerHTML = '';
                if (data.messages) {
                    const ids = Object.keys(data.messages).sort((a, b) => data.messages[a].timestamp - data.messages[b].timestamp);
                    ids.forEach(id => {
                        const msg = data.messages[id];
                        const div = document.createElement('div');
                        div.className = `message ${msg.role}`;
                        div.textContent = msg.content;
                        chatMessages.appendChild(div);
                    });
                } else {
                    chatMessages.innerHTML = '<div class="empty">Нет сообщений</div>';
                }
                chatMessages.scrollTop = chatMessages.scrollHeight;
                document.querySelectorAll('.chat-item').forEach(el => el.classList.remove('active'));
                const items = document.querySelectorAll('.chat-item');
                const index = Array.from(items).findIndex(el => el.onclick && el.onclick.toString().includes(chatId));
                if (index !== -1 && items[index]) items[index].classList.add('active');
            } catch (error) {
                console.error(error);
            }
        }

        window.createNewChat = async function() {
            if (!currentUser) return;
            try {
                const chatId = `chat_${Date.now()}`;
                await set(ref(db, `users/${currentUser.uid}/ai_chats/${chatId}`), {
                    title: 'Новый чат',
                    created_at: new Date().toISOString(),
                    updated_at: new Date().toISOString(),
                    messages: {}
                });
                await loadUserChats();
                await openChat(chatId);
            } catch (error) {
                console.error(error);
            }
        };

        window.sendMessage = async function() {
            const text = chatInput.value.trim();
            if (!text || !currentUser || !currentChatId || isProcessing) {
                if (!currentUser) alert('Войдите в аккаунт');
                return;
            }
            chatInput.value = '';
            sendBtn.disabled = true;
            isProcessing = true;

            try {
                const msgRef = push(ref(db, `users/${currentUser.uid}/ai_chats/${currentChatId}/messages`));
                await set(msgRef, { role: 'user', content: text, timestamp: Date.now() });
                await update(ref(db, `users/${currentUser.uid}/ai_chats/${currentChatId}`), { updated_at: new Date().toISOString() });

                const snapshot = await get(ref(db, `users/${currentUser.uid}/ai_chats/${currentChatId}/messages`));
                const data = snapshot.val();
                const history = [];
                if (data) {
                    const ids = Object.keys(data).sort((a, b) => data[a].timestamp - data[b].timestamp);
                    ids.forEach(id => {
                        history.push({ role: data[id].role, content: data[id].content });
                    });
                }

                const userSnapshot = await get(ref(db, `users/${currentUser.uid}`));
                const userData = userSnapshot.val();
                const subscription = getSubscription(userData.role || 'free');

                const loadingDiv = document.createElement('div');
                loadingDiv.className = 'message assistant loading';
                loadingDiv.textContent = '🧠 Думаю...';
                chatMessages.appendChild(loadingDiv);
                chatMessages.scrollTop = chatMessages.scrollHeight;

                const response = await getAIResponse(history, subscription);

                if (loadingDiv.parentNode) loadingDiv.remove();

                const resRef = push(ref(db, `users/${currentUser.uid}/ai_chats/${currentChatId}/messages`));
                await set(resRef, { role: 'assistant', content: response, timestamp: Date.now() });

                await openChat(currentChatId);
                await loadUserChats();

            } catch (error) {
                console.error(error);
                const loading = chatMessages.querySelector('.message.assistant.loading');
                if (loading) loading.remove();

                const errorDiv = document.createElement('div');
                errorDiv.className = 'message assistant error';
                errorDiv.textContent = '❌ ' + (error.message || 'Не удалось получить ответ');
                chatMessages.appendChild(errorDiv);
                chatMessages.scrollTop = chatMessages.scrollHeight;
            } finally {
                sendBtn.disabled = false;
                isProcessing = false;
            }
        };

        // ===== СОСТОЯНИЕ АВТОРИЗАЦИИ =====
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                await updateUI(user);
            } else {
                await updateUI(null);
            }
        });

        // ===== ЗВЁЗДЫ =====
        function createStars() {
            const container = document.getElementById('stars');
            for (let i = 0; i < 120; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.width = (Math.random() * 2 + 1) + 'px';
                star.style.height = star.style.width;
                star.style.setProperty('--duration', (Math.random() * 3 + 2) + 's');
                star.style.animationDelay = (Math.random() * 5) + 's';
                container.appendChild(star);
            }
        }
        createStars();

        console.log('🚀 Nemesis AI готов к работе!');
        console.log('🤖 Модель:', AI_MODEL);
    </script>

</body>
</html>
