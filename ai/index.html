<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nemesis AI — ИИ чат</title>
    <meta name="theme-color" content="#07070d" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #07070d;
            font-family: 'Inter', sans-serif;
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 20px;
        }
        #stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }
        .star {
            position: absolute;
            width: 2px;
            height: 2px;
            background: #fff;
            border-radius: 50%;
            opacity: 0.6;
            animation: twinkle var(--duration) ease-in-out infinite alternate;
        }
        @keyframes twinkle {
            0% { opacity: 0.2; transform: scale(0.8); }
            100% { opacity: 0.9; transform: scale(1.2); }
        }
        .container {
            width: 100%;
            max-width: 900px;
            position: relative;
            z-index: 5;
            display: flex;
            flex-direction: column;
            height: 94vh;
            max-height: 960px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 0 18px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            flex-shrink: 0;
        }
        .header .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 20px;
            font-weight: 800;
            color: #fff;
            text-decoration: none;
        }
        .header .logo .icon {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: rgba(108,99,255,0.15);
            border: 1px solid rgba(108,99,255,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: #6c63ff;
        }
        .header .logo span.nemesis {
            background: linear-gradient(135deg, #6c63ff, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .header .back-btn {
            color: #8899bb;
            text-decoration: none;
            font-size: 13px;
            padding: 8px 18px;
            border-radius: 10px;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.05);
            transition: 0.3s;
        }
        .header .back-btn:hover { color: #fff; background: rgba(255,255,255,0.06); }
        .profile-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: rgba(255,255,255,0.025);
            border-radius: 14px;
            border: 1px solid rgba(255,255,255,0.04);
            margin-bottom: 16px;
            flex-shrink: 0;
        }
        .profile-bar .user {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #8899bb;
            font-size: 13px;
        }
        .profile-bar .user .avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: linear-gradient(135deg, #6c63ff, #a78bfa);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 700;
            color: #fff;
        }
        .profile-bar .user .name { color: #fff; font-weight: 600; }
        .profile-bar .role {
            font-size: 11px;
            padding: 4px 14px;
            border-radius: 20px;
        }
        .profile-bar .role.free { background: rgba(255,255,255,0.05); color: #8888aa; }
        .profile-bar .role.elite { background: rgba(108,99,255,0.1); color: #6c63ff; }
        .profile-bar .role.ai_basic { background: rgba(108,99,255,0.15); color: #6c63ff; }
        .profile-bar .role.ai_max { background: rgba(255,215,0,0.1); color: #ffd700; }
        .profile-bar .role.nemesis {
            background: linear-gradient(135deg, rgba(255,215,0,0.2), rgba(255,215,0,0.05));
            color: #ffd700;
            box-shadow: 0 0 20px rgba(255,215,0,0.1);
        }
        .chat-list {
            background: rgba(255,255,255,0.025);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 16px;
            max-height: 180px;
            overflow-y: auto;
            flex-shrink: 0;
        }
        .chat-list .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            border: none;
            padding: 0;
        }
        .chat-list .header span { color: #8888aa; font-size: 13px; }
        .chat-list .header button {
            background: rgba(108,99,255,0.2);
            border: 1px solid rgba(108,99,255,0.25);
            color: #fff;
            padding: 4px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            font-family: 'Inter', sans-serif;
            transition: 0.2s;
        }
        .chat-list .header button:hover { background: rgba(108,99,255,0.3); }
        .chat-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
            margin-bottom: 4px;
        }
        .chat-item:hover { background: rgba(108,99,255,0.05); }
        .chat-item.active { background: rgba(108,99,255,0.08); }
        .chat-item .title { color: #fff; font-size: 13px; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .chat-item .count { color: #555566; font-size: 11px; margin-right: 8px; }
        .chat-item .del-chat {
            color: #555566;
            cursor: pointer;
            font-size: 14px;
            padding: 0 4px;
            transition: 0.2s;
            line-height: 1;
        }
        .chat-item .del-chat:hover {
            color: #ff4455;
            background: rgba(255,68,68,0.1);
            border-radius: 4px;
        }
        .chat-empty { color: #555566; text-align: center; padding: 12px; }
        .chat-window {
            background: rgba(255,255,255,0.025);
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.05);
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            min-height: 0;
        }
        .chat-messages {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
        }
        .chat-messages .empty {
            text-align: center;
            color: #555566;
            padding: 40px 0;
        }
        .message {
            padding: 10px 16px;
            border-radius: 12px;
            margin-bottom: 8px;
            max-width: 85%;
            font-size: 14px;
            line-height: 1.6;
        }
        .message.user {
            background: rgba(108,99,255,0.15);
            margin-left: auto;
            color: #fff;
        }
        .message.user img {
            max-width: 100%;
            border-radius: 8px;
            margin-top: 6px;
            display: block;
        }
        .message.assistant {
            background: rgba(255,255,255,0.05);
            color: #ccc;
        }
        .message.assistant .msg-header {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 4px;
            font-weight: 600;
            color: #6c63ff;
            font-size: 11px;
        }
        .message.assistant.loading { opacity: 0.6; }
        .message.assistant.error { color: #ff4444; background: rgba(255,68,68,0.08); }
        .message .cursor-blink {
            display: inline-block;
            width: 2px;
            height: 16px;
            background: #6c63ff;
            margin-left: 2px;
            animation: blink 0.8s infinite;
            vertical-align: text-bottom;
        }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
        .code-block {
            background: rgba(0,0,0,0.4);
            border-radius: 10px;
            border: 1px solid rgba(108,99,255,0.12);
            margin: 6px 0;
            overflow: hidden;
        }
        .code-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 12px;
            background: rgba(255,255,255,0.03);
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .code-lang {
            color: #6c63ff;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
        }
        .code-header-actions {
            display: flex;
            gap: 6px;
        }
        .copy-btn, .run-btn {
            background: rgba(108,99,255,0.12);
            border: none;
            color: #fff;
            padding: 2px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
            font-family: 'Inter', sans-serif;
            transition: 0.2s;
        }
        .copy-btn:hover, .run-btn:hover {
            background: rgba(108,99,255,0.25);
        }
        .run-btn {
            background: rgba(34,197,94,0.12);
            color: #22c55e;
        }
        .run-btn:hover {
            background: rgba(34,197,94,0.25);
        }
        .code-block pre {
            margin: 0;
            padding: 10px 14px;
            overflow-x: auto;
        }
        .code-block code {
            font-family: 'Monaco', 'Menlo', monospace;
            font-size: 12px;
            color: #e0e0e0;
            white-space: pre-wrap;
        }
        .chat-input-area {
            display: flex;
            gap: 10px;
            padding: 12px;
            border-top: 1px solid rgba(255,255,255,0.05);
            flex-wrap: wrap;
            flex-shrink: 0;
        }
        .chat-input-area input[type="text"] {
            flex: 1;
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 12px;
            padding: 12px 16px;
            color: #fff;
            font-size: 14px;
            outline: none;
            font-family: 'Inter', sans-serif;
            min-width: 150px;
        }
        .chat-input-area input[type="text"]::placeholder { color: #555566; }
        .chat-input-area input[type="text"]:focus { border-color: #6c63ff; }
        .chat-input-area button {
            background: rgba(108,99,255,0.2);
            border: 1px solid rgba(108,99,255,0.25);
            color: #fff;
            padding: 12px 20px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 18px;
            transition: 0.2s;
            font-family: 'Inter', sans-serif;
        }
        .chat-input-area button:hover { background: rgba(108,99,255,0.3); }
        .chat-input-area button:disabled { opacity: 0.3; cursor: not-allowed; }
        .file-btn {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.06);
            color: #8899bb;
            padding: 12px 16px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 18px;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .file-btn:hover { background: rgba(255,255,255,0.1); color: #fff; }
        .file-btn.uploading { opacity: 0.5; cursor: wait; }
        .file-preview {
            width: 100%;
            margin-top: 8px;
            padding: 8px 12px;
            background: rgba(255,255,255,0.03);
            border-radius: 8px;
            font-size: 12px;
            color: #8888aa;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .file-preview img {
            max-height: 40px;
            border-radius: 4px;
        }
        .file-preview .remove-file {
            color: #ff4455;
            cursor: pointer;
            font-weight: 700;
        }
        .login-box {
            background: rgba(255,255,255,0.025);
            border-radius: 24px;
            border: 1px solid rgba(255,255,255,0.05);
            padding: 40px;
            max-width: 420px;
            margin: 40px auto;
            text-align: center;
        }
        .login-box h2 { font-size: 24px; margin-bottom: 8px; }
        .login-box .sub { color: #8888aa; font-size: 12px; margin-bottom: 24px; }
        .login-box input {
            width: 100%;
            padding: 14px 16px;
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 12px;
            color: #fff;
            font-size: 14px;
            outline: none;
            font-family: 'Inter', sans-serif;
            margin-bottom: 12px;
        }
        .login-box input:focus { border-color: #6c63ff; }
        .login-box .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, rgba(108,99,255,0.15), rgba(108,99,255,0.05));
            border: 1px solid rgba(108,99,255,0.15);
            border-radius: 60px;
            color: #fff;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: 0.3s;
            font-family: 'Inter', sans-serif;
        }
        .login-box .btn:hover { background: rgba(108,99,255,0.2); }
        .login-box .toggle {
            margin-top: 14px;
            font-size: 13px;
            color: #8888aa;
        }
        .login-box .toggle span { color: #6c63ff; cursor: pointer; font-weight: 600; }
        .login-box .status { margin-top: 12px; font-size: 13px; min-height: 20px; color: #8888aa; }
        .hidden { display: none !important; }
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(11,11,18,0.95);
            color: #fff;
            padding: 14px 36px;
            border-radius: 60px;
            border: 1px solid rgba(108,99,255,0.15);
            font-size: 14px;
            font-weight: 600;
            z-index: 9999;
            backdrop-filter: blur(12px);
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            animation: fadeUp 0.3s ease;
            text-align: center;
            max-width: 90%;
        }
        .toast.fade-out { opacity: 0; transition: opacity 0.4s ease; }
        .preview-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 10000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 40px;
            backdrop-filter: blur(8px);
        }
        .preview-modal.show { display: flex; }
        .preview-modal .modal-content {
            background: #0d0d1a;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.06);
            width: 100%;
            max-width: 900px;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 40px 80px rgba(0,0,0,0.8);
        }
        .preview-modal .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 24px;
            border-bottom: 1px solid rgba(255,255,255,0.04);
            flex-shrink: 0;
        }
        .preview-modal .modal-header h3 { font-size: 16px; font-weight: 600; color: #fff; }
        .preview-modal .modal-header .close-btn {
            background: rgba(255,255,255,0.03);
            border: none;
            color: #8899bb;
            font-size: 24px;
            cursor: pointer;
            padding: 4px 12px;
            border-radius: 8px;
            transition: 0.2s;
        }
        .preview-modal .modal-header .close-btn:hover {
            color: #fff;
            background: rgba(255,255,255,0.06);
        }
        .preview-modal .modal-body {
            flex: 1;
            padding: 0;
            min-height: 400px;
            background: #fff;
        }
        .preview-modal .modal-body iframe {
            width: 100%;
            height: 100%;
            min-height: 400px;
            border: none;
            background: #fff;
        }
        .preview-modal .modal-footer {
            padding: 12px 24px;
            border-top: 1px solid rgba(255,255,255,0.04);
            display: flex;
            gap: 12px;
            flex-shrink: 0;
        }
        .preview-modal .modal-footer .btn {
            padding: 8px 20px;
            border-radius: 8px;
            border: none;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            transition: 0.2s;
        }
        .preview-modal .modal-footer .btn-primary {
            background: rgba(108,99,255,0.15);
            color: #6c63ff;
            border: 1px solid rgba(108,99,255,0.15);
        }
        .preview-modal .modal-footer .btn-primary:hover {
            background: rgba(108,99,255,0.25);
        }
        .preview-modal .modal-footer .btn-danger {
            background: rgba(255,68,68,0.05);
            color: #ff4455;
            border: 1px solid rgba(255,68,68,0.08);
        }
        .preview-modal .modal-footer .btn-danger:hover {
            background: rgba(255,68,68,0.1);
        }
        @media (max-width: 600px) {
            .header .logo { font-size: 17px; }
            .chat-list { max-height: 120px; }
            .login-box { padding: 24px; margin: 20px auto; }
            .chat-input-area input[type="text"] { min-width: 100px; }
            .preview-modal { padding: 20px; }
            .preview-modal .modal-body { min-height: 250px; }
            .preview-modal .modal-body iframe { min-height: 250px; }
        }
    </style>
</head>
<body>

    <div id="stars"></div>

    <div class="container">

        <div class="header">
            <a href="/" class="logo">
                <div class="icon">N</div>
                <span class="nemesis">NEMESIS</span> <span style="color:#6c63ff;">AI</span>
            </a>
            <a href="/" class="back-btn">← На главную</a>
        </div>

        <div id="main-content" style="display:flex; flex-direction:column; flex:1; min-height:0;">

            <div id="login-section" style="display:flex; align-items:center; justify-content:center; flex:1;">
                <div class="login-box">
                    <h2 id="form-title">ВХОД</h2>
                    <div class="sub" id="form-subtitle">ВОЙДИТЕ В СВОЙ АККАУНТ</div>
                    <form id="auth-form" onsubmit="handleAuth(event)">
                        <div id="reg-fields" class="hidden">
                            <input type="text" id="reg-username" placeholder="ИМЯ ПОЛЬЗОВАТЕЛЯ" autocomplete="off" />
                        </div>
                        <input type="email" id="auth-email" placeholder="EMAIL" required autocomplete="email" />
                        <input type="password" id="auth-pass" placeholder="ПАРОЛЬ" required autocomplete="current-password" />
                        <div id="reg-pass-repeat" class="hidden">
                            <input type="password" id="auth-pass-repeat" placeholder="ПОВТОРИТЕ ПАРОЛЬ" autocomplete="new-password" />
                        </div>
                        <button type="submit" class="btn" id="auth-btn">ВОЙТИ</button>
                    </form>
                    <div class="toggle">
                        <span id="toggle-link">НЕТ АККАУНТА? ЗАРЕГИСТРИРУЙТЕСЬ</span>
                    </div>
                    <div class="status" id="auth-status"></div>
                </div>
            </div>

            <div id="chat-section" style="display:none; flex-direction:column; flex:1; min-height:0;">

                <div class="profile-bar">
                    <div class="user">
                        <div class="avatar" id="user-avatar">👤</div>
                        <span class="name" id="user-name">Пользователь</span>
                    </div>
                    <span class="role" id="user-role">FREE</span>
                    <button onclick="logout()" style="background:rgba(255,0,0,0.05); border:1px solid rgba(255,0,0,0.08); color:#ff4455; padding:4px 14px; border-radius:8px; cursor:pointer; font-size:11px; font-family:'Inter',sans-serif;">Выйти</button>
                </div>

                <div class="chat-list">
                    <div class="header">
                        <span>📋 Мои чаты</span>
                        <button onclick="createNewChat()">+ Новый</button>
                    </div>
                    <div id="chat-list-items"><div class="chat-empty">Нет чатов</div></div>
                </div>

                <div class="chat-window">
                    <div class="chat-messages" id="chat-messages">
                        <div class="empty">Начните новый чат или выберите существующий</div>
                    </div>
                    <div class="chat-input-area">
                        <input id="chat-input" type="text" placeholder="Напиши сообщение..." onkeydown="if(event.key==='Enter') sendMessage()">
                        <label for="file-input" class="file-btn" id="file-label">📎</label>
                        <input type="file" id="file-input" accept="image/*" style="display:none">
                        <button id="send-btn" onclick="sendMessage()">📤</button>
                    </div>
                    <div id="file-preview" class="file-preview hidden"></div>
                </div>

            </div>

        </div>

    </div>

    <div class="preview-modal" id="preview-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>▶ Результат выполнения</h3>
                <button class="close-btn" onclick="closePreview()">✕</button>
            </div>
            <div class="modal-body">
                <iframe id="preview-iframe" sandbox="allow-scripts" srcdoc=""></iframe>
            </div>
            <div class="modal-footer">
                <button class="btn btn-primary" onclick="openInNewTab()">↗ Открыть в новой вкладке</button>
                <button class="btn btn-danger" onclick="closePreview()">✕ Закрыть</button>
            </div>
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "firebase/app": "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js",
                "firebase/auth": "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js",
                "firebase/database": "https://www.gstatic.com/firebasejs/11.6.0/firebase-database.js"
            }
        }
    </script>

    <script type="module">
        import { initializeApp } from "firebase/app";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, updateProfile, signOut } from "firebase/auth";
        import { getDatabase, ref, set, get, push, update, remove } from "firebase/database";

        const firebaseConfig = {
            apiKey: "AIzaSyA47KFVXVAXEjIkwCqbkwM7yLUGUco8ov8",
            authDomain: "nemesissteam-13577.firebaseapp.com",
            databaseURL: "https://nemesissteam-13577-default-rtdb.firebaseio.com",
            projectId: "nemesissteam-13577",
            storageBucket: "nemesissteam-13577.firebasestorage.app",
            messagingSenderId: "649763368476",
            appId: "1:649763368476:web:de4e044d4d971168fa79d9",

            let blockIndex = 0;
            return text.replace(codeRegex, (match, language, code) => {
                const lang = language || 'plaintext';
                const escapedCode = escapeHtml(code);
                const isHtml = ['html', 'htm', 'xhtml'].includes(lang.toLowerCase());
                const runBtn = isHtml ? `<button class="run-btn" onclick="runCode(this)">▶ Запустить</button>` : '';
                return `<div class="code-block" data-index="${blockIndex++}">
                            <div class="code-header">
                                <span class="code-lang">${escapeHtml(lang)}</span>
                                <div class="code-header-actions">
                                    ${runBtn}
                                    <button class="copy-btn" onclick="copyCode(this)">📋 Копировать</button>
                                </div>
                            </div>
                            <pre><code>${escapedCode}</code></pre>

            });
        }

        async function uploadImage(file) {
            if (!file) throw new Error('Нет файла');
            
            const compressedDataUrl = await compressImage(file);
            const base64Data = compressedDataUrl.split(',')[1];
            
            const formData = new FormData();

                });

                const data = await response.json();
                console.log('📸 imgBB response:', data);

                if (data.success) {
                    return data.data.url;
                }
                throw new Error(data.error?.message || 'Ошибка загрузки');
            } catch (error) {

            }

        // ===== СЖАТИЕ ИЗОБРАЖЕНИЯ =====
        function compressImage(file, maxDim = 1280, quality = 0.8) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                const reader = new FileReader();
                reader.onload = (e) => { img.src = e.target.result; };
                reader.onerror = reject;
                img.onload = () => {
                    let { width, height } = img;
                    if (width > maxDim || height > maxDim) {
                        if (width > height) {
                            height = Math.round(height * (maxDim / width));
                            width = maxDim;
                        } else {
                            width = Math.round(width * (maxDim / height));
                            height = maxDim;
                        }
                    }
                    const canvas = document.createElement('canvas');
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    resolve(canvas.toDataURL('image/jpeg', quality));
                };
                img.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        // ===== СТРИМИНГ ОТВЕТА =====
        async function streamAIResponse(messages, imageUrl, onChunk) {
            let formatted = [{ role: 'system', content: SYSTEM_PROMPT }, ...messages];
            if (imageUrl) {
                const last = messages[messages.length - 1];
                formatted = [
                    { role: 'system', content: SYSTEM_PROMPT },
                    ...messages.slice(0, -1),
                    {
                        role: 'user',
                        content: [
                            { type: 'text', text: last.content },
                            { type: 'image_url', image_url: { url: imageUrl } },
                        ],
                    },
                ];
            }

            const response = await fetch(AGNES_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${AGNES_API_KEY}`,
                },
                body: JSON.stringify({
                    model: AGNES_MODEL,
                    messages: formatted,
                    max_tokens: 500,
                    temperature: 0.7,
                    stream: true,
                }),
            });

            if (!response.ok || !response.body) {
                const errText = await response.text().catch(() => '');
                throw new Error(`Ошибка AI: ${errText || response.status}`);
            }

            const reader = response.body.getReader();
            const decoder = new TextDecoder();
            let buffer = '';

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                buffer += decoder.decode(value, { stream: true });
                const lines = buffer.split('\n');
                buffer = lines.pop() || '';

                for (const line of lines) {
                    if (!line.startsWith('data: ')) continue;
                    const data = line.slice(6);
                    if (data === '[DONE]') continue;
                    try {
                        const json = JSON.parse(data);
                        const chunk = json.choices?.[0]?.delta?.content || '';
                        if (chunk) onChunk(chunk);
                    } catch (_) {}
                }
            }
        }

                star.style.top = Math.random() * 100 + '%';
                star.style.width = (Math.random() * 2 + 1) + 'px';
                star.style.height = star.style.width;
                star.style.setProperty('--duration', (Math.random() * 3 + 2) + 's');
                star.style.animationDelay = (Math.random() * 5) + 's';
                container.appendChild(star);
            }
        }
        createStars();

        console.log('🚀 Nemesis AI готов к работе!');
