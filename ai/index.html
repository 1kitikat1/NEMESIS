<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nemesis AI — ИИ чат</title>
    <meta name="theme-color" content="#07070d" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #07070d;
            font-family: 'Inter', sans-serif;
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 20px;
        }
        #stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }
        .star {
            position: absolute;
            width: 2px;
            height: 2px;
            background: #fff;
            border-radius: 50%;
            opacity: 0.6;
            animation: twinkle var(--duration) ease-in-out infinite alternate;
        }
        @keyframes twinkle {
            0% { opacity: 0.2; transform: scale(0.8); }
            100% { opacity: 0.9; transform: scale(1.2); }
        }
        .container {
            width: 100%;
            max-width: 1180px;
            position: relative;
            z-index: 5;
            display: flex;
            flex-direction: column;
            height: 94vh;
            max-height: 1000px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 0 18px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            flex-shrink: 0;
        }
        .header .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 20px;
            font-weight: 800;
            color: #fff;
            text-decoration: none;
        }
        .header .logo .icon {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: rgba(108,99,255,0.15);
            border: 1px solid rgba(108,99,255,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: #6c63ff;
            animation: iconGlow 2.4s ease-in-out infinite;
        }
        @keyframes iconGlow {
            0%, 100% { box-shadow: 0 0 0 rgba(108,99,255,0); }
            50% { box-shadow: 0 0 18px rgba(108,99,255,0.55); }
        }
        .header .logo span.nemesis {
            background: linear-gradient(135deg, #6c63ff, #a78bfa, #ffd700, #6c63ff);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradientShift 6s ease infinite;
        }
        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .header .back-btn {
            color: #8899bb;
            text-decoration: none;
            font-size: 13px;
            padding: 8px 18px;
            border-radius: 10px;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.05);
            transition: 0.3s;
        }
        .header .back-btn:hover { color: #fff; background: rgba(255,255,255,0.06); }
        .avatar {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: linear-gradient(135deg, #6c63ff, #a78bfa);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 700;
            color: #fff;
            flex-shrink: 0;
        }
        .role {
            font-size: 11px;
            padding: 4px 12px;
            border-radius: 20px;
            display: inline-block;
        }
        .role.free { background: rgba(255,255,255,0.05); color: #8888aa; }
        .role.elite { background: rgba(108,99,255,0.1); color: #6c63ff; }
        .role.ai_basic { background: rgba(108,99,255,0.15); color: #6c63ff; }
        .role.ai_max { background: rgba(255,215,0,0.1); color: #ffd700; }
        .role.nemesis {
            background: linear-gradient(135deg, rgba(255,215,0,0.2), rgba(255,215,0,0.05));
            color: #ffd700;
            box-shadow: 0 0 20px rgba(255,215,0,0.1);
        }
        .app-layout {
            display: flex;
            flex: 1;
            min-height: 0;
            gap: 16px;
        }

        .sidebar {
            width: 280px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            background: rgba(20,18,35,0.45);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-radius: 18px;
            border: 1px solid rgba(255,255,255,0.06);
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }
        .sidebar-profile {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 16px;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            background: linear-gradient(135deg, rgba(108,99,255,0.08), transparent);
        }
        .sidebar-profile-info {
            display: flex;
            flex-direction: column;
            gap: 5px;
            flex: 1;
            min-width: 0;
        }
        .sidebar-profile-info .name {
            font-size: 13px;
            font-weight: 600;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .sidebar-profile-info .role { width: fit-content; }
        .logout-btn {
            background: rgba(255,68,68,0.06);
            border: 1px solid rgba(255,68,68,0.1);
            color: #ff4455;
            width: 32px;
            height: 32px;
            flex-shrink: 0;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.25s;
        }
        .logout-btn:hover { background: rgba(255,68,68,0.2); transform: scale(1.08); }

        .sidebar-chats {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
            padding: 14px;
        }
        .sidebar-chats-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            flex-shrink: 0;
        }
        .sidebar-chats-header span {
            color: #8888aa;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .sidebar-chats-header button {
            background: linear-gradient(135deg, rgba(108,99,255,0.35), rgba(167,139,250,0.25));
            border: 1px solid rgba(108,99,255,0.35);
            color: #fff;
            padding: 5px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            font-family: 'Inter', sans-serif;
            transition: 0.25s;
        }
        .sidebar-chats-header button:hover { background: rgba(108,99,255,0.5); box-shadow: 0 0 14px rgba(108,99,255,0.4); transform: translateY(-1px); }
        .chat-list-items { flex: 1; overflow-y: auto; }

        .chat-messages::-webkit-scrollbar,
        .chat-list-items::-webkit-scrollbar { width: 6px; }
        .chat-messages::-webkit-scrollbar-thumb,
        .chat-list-items::-webkit-scrollbar-thumb {
            background: rgba(108,99,255,0.25);
            border-radius: 10px;
        }
        .chat-messages::-webkit-scrollbar-thumb:hover,
        .chat-list-items::-webkit-scrollbar-thumb:hover { background: rgba(108,99,255,0.4); }
        .chat-messages::-webkit-scrollbar-track,
        .chat-list-items::-webkit-scrollbar-track { background: transparent; }

        .chat-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 12px;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.2s;
            margin-bottom: 4px;
            border-left: 2px solid transparent;
        }
        .chat-item:hover { background: rgba(108,99,255,0.08); transform: translateX(3px); }
        .chat-item.active { background: rgba(108,99,255,0.14); border-left-color: #6c63ff; }
        .chat-item .title { color: #fff; font-size: 13px; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .chat-item .count { color: #555566; font-size: 11px; margin-right: 8px; }
        .chat-item .del-chat {
            color: #555566;
            cursor: pointer;
            font-size: 14px;
            padding: 0 4px;
            transition: 0.2s;
            line-height: 1;
        }
        .chat-item .del-chat:hover {
            color: #ff4455;
            background: rgba(255,68,68,0.1);
            border-radius: 4px;
        }
        .chat-empty { color: #555566; text-align: center; padding: 12px; }
        .chat-window {
            background: rgba(20,18,35,0.4);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-radius: 18px;
            border: 1px solid rgba(255,255,255,0.06);
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            min-height: 0;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
        }
        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }
        .chat-messages .empty {
            text-align: center;
            color: #555566;
            padding: 40px 0;
        }
        @keyframes msgIn {
            from { opacity: 0; transform: translateY(10px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .message {
            padding: 12px 18px;
            border-radius: 16px;
            margin-bottom: 10px;
            max-width: 85%;
            font-size: 14px;
            line-height: 1.65;
            animation: msgIn 0.35s ease;
        }
        .message.user {
            background: linear-gradient(135deg, rgba(108,99,255,0.28), rgba(167,139,250,0.16));
            border: 1px solid rgba(108,99,255,0.2);
            margin-left: auto;
            color: #fff;
            border-bottom-right-radius: 4px;
        }
        .message.user img {
            max-width: 100%;
            border-radius: 8px;
            margin-top: 6px;
            display: block;
        }
        .message.assistant {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.05);
            color: #ccc;
            border-bottom-left-radius: 4px;
        }
        .message.assistant .msg-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 6px;
            font-weight: 600;
            color: #6c63ff;
            font-size: 11px;
        }
        .message.assistant.loading { opacity: 0.6; }
        .message.assistant.error { color: #ff4444; background: rgba(255,68,68,0.08); }

        .typing-dots { display: inline-flex; gap: 3px; align-items: center; }
        .typing-dots span {
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: #6c63ff;
            animation: dotBounce 1.1s ease-in-out infinite;
        }
        .typing-dots span:nth-child(2) { animation-delay: 0.15s; }
        .typing-dots span:nth-child(3) { animation-delay: 0.3s; }
        @keyframes dotBounce {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
            30% { transform: translateY(-4px); opacity: 1; }
        }

        .code-block {
            background: rgba(0,0,0,0.45);
            border-radius: 12px;
            border: 1px solid rgba(108,99,255,0.15);
            margin: 8px 0;
            overflow: hidden;
        }
        .code-block.in-progress {
            border-color: rgba(108,99,255,0.4);
            box-shadow: 0 0 16px rgba(108,99,255,0.12);
        }
        .code-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 12px;
            background: rgba(255,255,255,0.03);
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .code-lang {
            color: #6c63ff;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
        }
        .code-typing {
            color: #555566;
            font-size: 11px;
        }
        .code-header-actions {
            display: flex;
            gap: 6px;
        }
        .copy-btn, .run-btn {
            background: rgba(108,99,255,0.12);
            border: none;
            color: #fff;
            padding: 3px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 11px;
            font-family: 'Inter', sans-serif;
            transition: 0.2s;
        }
        .copy-btn:hover, .run-btn:hover { transform: translateY(-1px); }
        .copy-btn:hover { background: rgba(108,99,255,0.3); }
        .run-btn {
            background: rgba(34,197,94,0.15);
            color: #22c55e;
        }
        .run-btn:hover { background: rgba(34,197,94,0.3); box-shadow: 0 0 12px rgba(34,197,94,0.35); }
        .code-block pre {
            margin: 0;
            padding: 10px 14px;
            overflow-x: auto;
        }
        .code-block code {
            font-family: 'Monaco', 'Menlo', monospace;
            font-size: 12px;
            color: #e0e0e0;
            white-space: pre-wrap;
        }
        .chat-input-area {
            display: flex;
            gap: 10px;
            padding: 14px;
            border-top: 1px solid rgba(255,255,255,0.06);
            flex-wrap: wrap;
            flex-shrink: 0;
        }
        .chat-input-area input[type="text"] {
            flex: 1;
            background: rgba(0,0,0,0.35);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 14px;
            padding: 13px 18px;
            color: #fff;
            font-size: 14px;
            outline: none;
            font-family: 'Inter', sans-serif;
            min-width: 150px;
            transition: 0.25s;
        }
        .chat-input-area input[type="text"]::placeholder { color: #555566; }
        .chat-input-area input[type="text"]:focus {
            border-color: #6c63ff;
            box-shadow: 0 0 0 3px rgba(108,99,255,0.15), 0 0 20px rgba(108,99,255,0.15);
        }
        .chat-input-area button {
            background: linear-gradient(135deg, #6c63ff, #a78bfa);
            border: none;
            color: #fff;
            padding: 12px 22px;
            border-radius: 14px;
            cursor: pointer;
            font-size: 18px;
            transition: 0.25s;
            font-family: 'Inter', sans-serif;
            box-shadow: 0 4px 16px rgba(108,99,255,0.3);
        }
        .chat-input-area button:hover:not(:disabled) { transform: translateY(-2px) scale(1.03); box-shadow: 0 8px 24px rgba(108,99,255,0.45); }
        .chat-input-area button:active:not(:disabled) { transform: translateY(0) scale(0.97); }
        .chat-input-area button:disabled { opacity: 0.3; cursor: not-allowed; }
        .file-btn {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.08);
            color: #8899bb;
            padding: 12px 16px;
            border-radius: 14px;
            cursor: pointer;
            font-size: 18px;
            transition: 0.25s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .file-btn:hover { background: rgba(255,255,255,0.1); color: #fff; transform: translateY(-2px); }
        .file-btn.uploading { opacity: 0.5; cursor: wait; }
        .file-preview {
            width: 100%;
            margin-top: 8px;
            padding: 8px 12px;
            background: rgba(255,255,255,0.03);
            border-radius: 8px;
            font-size: 12px;
            color: #8888aa;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .file-preview img {
            max-height: 40px;
            border-radius: 4px;
        }
        .file-preview .remove-file {
            color: #ff4455;
            cursor: pointer;
            font-weight: 700;
        }
        .login-box {
            background: rgba(255,255,255,0.025);
            border-radius: 24px;
            border: 1px solid rgba(255,255,255,0.05);
            padding: 40px;
            max-width: 420px;
            margin: 40px auto;
            text-align: center;
        }
        .login-box h2 { font-size: 24px; margin-bottom: 8px; }
        .login-box .sub { color: #8888aa; font-size: 12px; margin-bottom: 24px; }
        .login-box input {
            width: 100%;
            padding: 14px 16px;
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 12px;
            color: #fff;
            font-size: 14px;
            outline: none;
            font-family: 'Inter', sans-serif;
            margin-bottom: 12px;
        }
        .login-box input:focus { border-color: #6c63ff; }
        .login-box .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, rgba(108,99,255,0.15), rgba(108,99,255,0.05));
            border: 1px solid rgba(108,99,255,0.15);
            border-radius: 60px;
            color: #fff;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: 0.3s;
            font-family: 'Inter', sans-serif;
        }
        .login-box .btn:hover { background: rgba(108,99,255,0.2); }
        .login-box .toggle {
            margin-top: 14px;
            font-size: 13px;
            color: #8888aa;
        }
        .login-box .toggle span { color: #6c63ff; cursor: pointer; font-weight: 600; }
        .login-box .status { margin-top: 12px; font-size: 13px; min-height: 20px; color: #8888aa; }
        .hidden { display: none !important; }
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(11,11,18,0.95);
            color: #fff;
            padding: 14px 36px;
            border-radius: 60px;
            border: 1px solid rgba(108,99,255,0.15);
            font-size: 14px;
            font-weight: 600;
            z-index: 9999;
            backdrop-filter: blur(12px);
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            animation: fadeUp 0.3s ease;
            text-align: center;
            max-width: 90%;
        }
        .toast.fade-out { opacity: 0; transition: opacity 0.4s ease; }
        @media (max-width: 760px) {
            .app-layout { flex-direction: column; }
            .sidebar { width: 100%; max-height: 220px; }
            .sidebar-chats { max-height: 150px; }
        }
        @media (max-width: 600px) {
            .header .logo { font-size: 17px; }
            .login-box { padding: 24px; margin: 20px auto; }
            .chat-input-area input[type="text"] { min-width: 100px; }
        }
    </style>
</head>
<body>

    <div id="stars"></div>

    <div class="container">

        <div class="header">
            <a href="/" class="logo">
                <div class="icon">N</div>
                <span class="nemesis">NEMESIS</span> <span style="color:#6c63ff;">AI</span>
            </a>
            <a href="/" class="back-btn">← На главную</a>
        </div>

        <div id="main-content" style="display:flex; flex-direction:column; flex:1; min-height:0;">

            <div id="login-section" style="display:flex; align-items:center; justify-content:center; flex:1;">
                <div class="login-box">
                    <h2 id="form-title">ВХОД</h2>
                    <div class="sub" id="form-subtitle">ВОЙДИТЕ В СВОЙ АККАУНТ</div>
                    <form id="auth-form" onsubmit="handleAuth(event)">
                        <div id="reg-fields" class="hidden">
                            <input type="text" id="reg-username" placeholder="ИМЯ ПОЛЬЗОВАТЕЛЯ" autocomplete="off" />
                        </div>
                        <input type="email" id="auth-email" placeholder="EMAIL" required autocomplete="email" />
                        <input type="password" id="auth-pass" placeholder="ПАРОЛЬ" required autocomplete="current-password" />
                        <div id="reg-pass-repeat" class="hidden">
                            <input type="password" id="auth-pass-repeat" placeholder="ПОВТОРИТЕ ПАРОЛЬ" autocomplete="new-password" />
                        </div>
                        <button type="submit" class="btn" id="auth-btn">ВОЙТИ</button>
                    </form>
                    <div class="toggle">
                        <span id="toggle-link">НЕТ АККАУНТА? ЗАРЕГИСТРИРУЙТЕСЬ</span>
                    </div>
                    <div class="status" id="auth-status"></div>
                </div>
            </div>

            <div id="chat-section" style="display:none; flex-direction:column; flex:1; min-height:0;">

                <div class="app-layout">

                    <aside class="sidebar">
                        <div class="sidebar-profile">
                            <div class="avatar" id="user-avatar">👤</div>
                            <div class="sidebar-profile-info">
                                <span class="name" id="user-name">Пользователь</span>
                                <span class="role" id="user-role">FREE</span>
                            </div>
                            <button class="logout-btn" onclick="logout()" title="Выйти">⏻</button>
                        </div>

                        <div class="sidebar-chats">
                            <div class="sidebar-chats-header">
                                <span>📋 Мои чаты</span>
                                <button onclick="createNewChat()">+ Новый</button>
                            </div>
                            <div id="chat-list-items" class="chat-list-items"><div class="chat-empty">Нет чатов</div></div>
                        </div>
                    </aside>

                    <div class="chat-window">
                        <div class="chat-messages" id="chat-messages">
                            <div class="empty">Начните новый чат или выберите существующий</div>
                        </div>
                        <div class="chat-input-area">
                            <input id="chat-input" type="text" placeholder="Напиши сообщение..." onkeydown="if(event.key==='Enter') sendMessage()">
                            <label for="file-input" class="file-btn" id="file-label">📎</label>
                            <input type="file" id="file-input" accept="image/*" style="display:none">
                            <button id="send-btn" onclick="sendMessage()">📤</button>
                        </div>
                        <div id="file-preview" class="file-preview hidden"></div>
                    </div>

                </div>

            </div>

        </div>

    </div>

    <div class="preview-modal" id="preview-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>▶ Результат выполнения</h3>
                <button class="close-btn" onclick="closePreview()">✕</button>
            </div>
            <div class="modal-body">
                <iframe id="preview-iframe" sandbox="allow-scripts" srcdoc=""></iframe>
            </div>
            <div class="modal-footer">
                <button class="btn btn-primary" onclick="openInNewTab()">↗ Открыть в новой вкладке</button>
                <button class="btn btn-danger" onclick="closePreview()">✕ Закрыть</button>
            </div>
        </div>
    </div>

    <script type="importmap">
        {

        // ===== РЕНДЕР СООБЩЕНИЯ (безопасен и во время стрима, и для готового текста) =====

        // недописанный — просто без кнопок, пока блок не закроется.
        function renderMessageContent(text) {
            const closedRegex = /```(\w+)?\n([\s\S]*?)```/g;
            let html = '';
            let lastIndex = 0;
            let blockIndex = 0;
            let m;

            while ((m = closedRegex.exec(text)) !== null) {
                html += escapeHtml(text.slice(lastIndex, m.index));
                html += renderCodeBlockHtml(m[1] || 'plaintext', m[2], blockIndex++, true);
                lastIndex = closedRegex.lastIndex;
            }

            const rest = text.slice(lastIndex);
            const openMatch = rest.match(/```(\w+)?\n?([\s\S]*)$/);
            if (openMatch && rest.includes('```')) {
                html += escapeHtml(rest.slice(0, openMatch.index));
                html += renderCodeBlockHtml(openMatch[1] || 'plaintext', openMatch[2] || '', blockIndex++, false);
            } else {
                html += escapeHtml(rest);
            }
            return html;
        }

                            <span class="code-lang">${escapeHtml(lang)}</span>

                        </div>
                        <pre><code>${escapeHtml(code)}</code></pre>

        }

        // Iframe-превью работает в песочнице sandbox="allow-scripts" (БЕЗ allow-same-origin —

        // Побочный эффект: обращение к localStorage/sessionStorage внутри такого iframe кидает

        // перехватом ошибок, чтобы вместо тишины было видно, что именно сломалось.
        const PREVIEW_SHIM = `<script>
        (function () {
            function memoryStorage() {
                var store = {};
                return {
                    getItem: function (k) { return Object.prototype.hasOwnProperty.call(store, k) ? store[k] : null; },
                    setItem: function (k, v) { store[k] = String(v); },
                    removeItem: function (k) { delete store[k]; },
                    clear: function () { store = {}; },
                    key: function (i) { return Object.keys(store)[i] || null; },
                    get length() { return Object.keys(store).length; }
                };
            }
            function ensureWorkingStorage(name) {
                try {
                    window[name].setItem('__t', '1');
                    window[name].removeItem('__t');
                } catch (e) {
                    try {
                        Object.defineProperty(window, name, { value: memoryStorage(), configurable: true });
                    } catch (e2) {}
                }
            }
            ensureWorkingStorage('localStorage');
            ensureWorkingStorage('sessionStorage');

            window.addEventListener('error', function (e) {
                showPreviewError((e && e.message) || 'Неизвестная ошибка в коде');
            });
            window.addEventListener('unhandledrejection', function (e) {
                showPreviewError((e && e.reason && e.reason.message) || 'Необработанная ошибка промиса');
            });

            function showPreviewError(msg) {
                var box = document.createElement('div');
                box.style.cssText = 'position:fixed;left:0;right:0;bottom:0;background:#2a0d0d;color:#ff8080;' +
                    'font:12px monospace;padding:10px 14px;z-index:999999;border-top:1px solid #ff4444;white-space:pre-wrap;';
                box.textContent = '⚠ Ошибка в превью: ' + msg;
                document.body.appendChild(box);
            }
        })();
        <\/script>`;

        function injectPreviewShim(html) {
            if (/<head[^>]*>/i.test(html)) {
                return html.replace(/<head[^>]*>/i, (m) => m + PREVIEW_SHIM);
            }
            if (/<body[^>]*>/i.test(html)) {
                return html.replace(/<body[^>]*>/i, (m) => m + PREVIEW_SHIM);
            }
            return PREVIEW_SHIM + html;
        }

        // ===== СЖАТИЕ ИЗОБРАЖЕНИЯ =====
        function compressImage(file, maxDim = 1280, quality = 0.8) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                const reader = new FileReader();
                reader.onload = (e) => { img.src = e.target.result; };
                reader.onerror = reject;
                img.onload = () => {
                    let { width, height } = img;
                    if (width > maxDim || height > maxDim) {
                        if (width > height) {
                            height = Math.round(height * (maxDim / width));
                            width = maxDim;
                        } else {
                            width = Math.round(width * (maxDim / height));
                            height = maxDim;
                        }
                    }
                    const canvas = document.createElement('canvas');
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    resolve(canvas.toDataURL('image/jpeg', quality));
                };
                img.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        // ===== ОДИН ЗАПРОС СТРИМИНГА (возвращает текст ответа и причину остановки) =====
        async function streamOnce(messages, imageUrl, maxTokens, onChunk) {
            let formatted = [{ role: 'system', content: SYSTEM_PROMPT }, ...messages];
            if (imageUrl) {
                const last = messages[messages.length - 1];
                formatted = [
                    { role: 'system', content: SYSTEM_PROMPT },
                    ...messages.slice(0, -1),
                    {
                        role: 'user',
                        content: [
                            { type: 'text', text: last.content },
                            { type: 'image_url', image_url: { url: imageUrl } },
                        ],
                    },
                ];
            }

            const response = await fetch(AGNES_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${AGNES_API_KEY}`,
                },
                body: JSON.stringify({
                    model: AGNES_MODEL,
                    messages: formatted,
                    max_tokens: maxTokens,
                    temperature: 0.5,
                    stream: true,
                }),
            });

            if (!response.ok || !response.body) {
                const errText = await response.text().catch(() => '');
                throw new Error(`Ошибка AI: ${errText || response.status}`);
            }

            const reader = response.body.getReader();
            const decoder = new TextDecoder();
            let buffer = '';
            let text = '';
            let finishReason = null;

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                buffer += decoder.decode(value, { stream: true });
                const lines = buffer.split('\n');
                buffer = lines.pop() || '';

                for (const line of lines) {
                    if (!line.startsWith('data: ')) continue;
                    const data = line.slice(6);
                    if (data === '[DONE]') continue;
                    try {
                        const json = JSON.parse(data);
                        const choice = json.choices?.[0];
                        const chunk = choice?.delta?.content || '';
                        if (chunk) {
                            text += chunk;
                            onChunk(chunk);
                        }
                        if (choice?.finish_reason) finishReason = choice.finish_reason;
                    } catch (_) {}
                }
            }

            return { text, finishReason };
        }

        // ===== СТРИМИНГ С АВТО-ПРОДОЛЖЕНИЕМ =====
        // Если ответ обрывается из-за лимита токенов (finish_reason === 'length'),
        // это раньше выглядело как "зависший"/оборванный код-блок. Теперь при таком
        // обрыве бот автоматически просит модель продолжить с того же места —
        // пользователь видит один непрерывный ответ.
        async function streamAIResponse(messages, imageUrl, role, onChunk) {
            const maxTokens = getMaxTokensForRole(role);
            const MAX_CONTINUATIONS = 3;
            let convo = messages;
            let fullText = '';
            let attempt = 0;
            let img = imageUrl;

            while (true) {
                const { text, finishReason } = await streamOnce(convo, img, maxTokens, onChunk);
                fullText += text;

                if (finishReason !== 'length' || attempt >= MAX_CONTINUATIONS) break;

                attempt++;
                convo = [
                    ...messages,
                    { role: 'assistant', content: fullText },
                    { role: 'user', content: 'Продолжи ответ ровно с того места, где остановился. Не повторяй уже написанное и обязательно закрой любой незакрытый блок кода.' }
                ];
                img = null; // картинку повторно не шлём в продолжениях
            }

            return fullText;
        }

                    if (password.length < 6) {

            } catch (error) {
                console.error(error);
                let msg = '❌ Ошибка! ';

                    case 'auth/email-already-in-use': msg += 'Email уже используется.'; break;

                authBtn.textContent = 'ВОЙТИ';
                toggleLink.textContent = 'НЕТ АККАУНТА? ЗАРЕГИСТРИРУЙТЕСЬ';
                regFields.classList.add('hidden');
                regPassRepeat.classList.add('hidden');
                authEmail.placeholder = 'EMAIL';
            } else {
                formTitle.textContent = 'РЕГИСТРАЦИЯ';
                formSubtitle.textContent = 'СОЗДАЙТЕ НОВЫЙ АККАУНТ';
                authBtn.textContent = 'ЗАРЕГИСТРИРОВАТЬСЯ';
                toggleLink.textContent = 'УЖЕ ЕСТЬ АККАУНТ? ВОЙДИТЕ';
                regFields.classList.remove('hidden');
                regPassRepeat.classList.remove('hidden');
                authEmail.placeholder = 'EMAIL (для входа)';
            }
            authStatus.textContent = '';
        });

        window.logout = async function() {
            try {
                await signOut(auth);
                await updateUI(null);
                showToast('Вы вышли из аккаунта');
            } catch (error) {
                console.error(error);
            }
        };

        // ===== ФАЙЛЫ =====
        fileInput.addEventListener('change', async function() {
            const file = this.files[0];
            if (!file) return;

            const info = labelForRole((userRole.className.split(' ')[1]) || 'free');
            if (!info.canVision) {
                showToast('❌ Ваш тариф не поддерживает загрузку фото. Купите AI+ или AI MAX!');
                fileInput.value = '';
                return;
            }

            filePreview.innerHTML = `<span>⏳ Загрузка фото...</span>`;
            filePreview.classList.remove('hidden');
            fileLabel.classList.add('uploading');

            try {
                const url = await uploadImage(file);
                currentImageUrl = url;
                filePreview.innerHTML = `
                    <img src="${url}" alt="preview">
                    <span>${escapeHtml(file.name)}</span>
                    <span class="remove-file" onclick="clearFile()">✕</span>
                `;
                showToast('✅ Фото загружено!');
            } catch (error) {
                console.error(error);
                showToast('❌ ' + (error.message || 'Ошибка загрузки фото'));
                clearFile();
            } finally {
                fileLabel.classList.remove('uploading');
            }
        });

        window.clearFile = function() {
            fileInput.value = '';
            filePreview.innerHTML = '';
            filePreview.classList.add('hidden');
            currentImageUrl = null;
        };

        // ===== ЧАТЫ =====
        async function loadUserChats() {
            if (!currentUser) return;
            try {
                const snapshot = await get(ref(db, `users/${currentUser.uid}/ai_chats`));
                const data = snapshot.val();
                chatListItems.innerHTML = '';
                if (!data || Object.keys(data).length === 0) {
                    chatListItems.innerHTML = '<div class="chat-empty">Нет чатов</div>';
                    return;
                }
                const ids = Object.keys(data).sort((a, b) => data[b].updated_at?.localeCompare(data[a].updated_at) || 0);
                ids.forEach(id => {
                    const chat = data[id];
                    const div = document.createElement('div');
                    div.className = 'chat-item' + (currentChatId === id ? ' active' : '');
                    div.innerHTML = `
                        <span class="title">${escapeHtml(chat.title || 'Новый чат')}</span>
                        <span class="count">${chat.messages ? Object.keys(chat.messages).length : 0}</span>
                        <span class="del-chat" onclick="deleteChat('${id}', event)">✕</span>
                    `;
                    div.addEventListener('click', () => openChat(id));
                    chatListItems.appendChild(div);
                });
            } catch (error) {
                console.error(error);
            }
        }

        async function openChat(chatId) {
            if (!currentUser) return;
            currentChatId = chatId;
            try {
                const snapshot = await get(ref(db, `users/${currentUser.uid}/ai_chats/${chatId}`));
                const data = snapshot.val();
                if (!data) return;
                chatMessages.innerHTML = '';
                if (data.messages) {
                    const ids = Object.keys(data.messages).sort((a, b) => data.messages[a].timestamp - data.messages[b].timestamp);
                    ids.forEach(id => {
                        const msg = data.messages[id];
                        const div = document.createElement('div');
                        div.className = `message ${msg.role}`;
                        if (msg.role === 'assistant') {
                            div.innerHTML = `<div class="msg-header">Nemesis AI</div>${renderMessageContent(msg.content)}`;
                        } else {
                            div.textContent = msg.content;
                            if (msg.imageUrl) {
                                const img = document.createElement('img');
                                img.src = msg.imageUrl;
                                div.appendChild(img);
                            }
                        }
                        chatMessages.appendChild(div);
                    });
                } else {
                    chatMessages.innerHTML = '<div class="empty">Нет сообщений</div>';
                }
                chatMessages.scrollTop = chatMessages.scrollHeight;
                await loadUserChats();
            } catch (error) {
                console.error(error);
            }
        }

        window.createNewChat = async function() {
            if (!currentUser) return;
            try {
                const chatId = `chat_${Date.now()}`;
                await set(ref(db, `users/${currentUser.uid}/ai_chats/${chatId}`), {
                    title: 'Новый чат',
                    created_at: new Date().toISOString(),
                    updated_at: new Date().toISOString(),
                    messages: {}
                });
                await loadUserChats();
                await openChat(chatId);
                showToast('Новый чат создан');
            } catch (error) {
                console.error(error);
                showToast('Ошибка создания чата');
            }
        };

        // ===== ОТПРАВКА СООБЩЕНИЯ (стрим + безопасный live-рендер кода) =====
        window.sendMessage = async function() {
            const text = chatInput.value.trim();
            if (!text || !currentUser || !currentChatId || isProcessing) {
                if (!currentUser) showToast('Войдите в аккаунт');
                else if (!currentChatId) showToast('Создайте или откройте чат');
                return;
            }

            const imageUrl = currentImageUrl;
            const roleClass = (userRole.className.split(' ')[1]) || 'free';

            chatInput.value = '';
            sendBtn.disabled = true;
            isProcessing = true;

            try {
                const msgRef = push(ref(db, `users/${currentUser.uid}/ai_chats/${currentChatId}/messages`));
                await set(msgRef, { role: 'user', content: text, imageUrl: imageUrl || null, timestamp: Date.now() });
                await update(ref(db, `users/${currentUser.uid}/ai_chats/${currentChatId}`), { updated_at: new Date().toISOString() });

                const userDiv = document.createElement('div');
                userDiv.className = 'message user';
                userDiv.textContent = text;
                if (imageUrl) {
                    const img = document.createElement('img');
                    img.src = imageUrl;
                    userDiv.appendChild(img);
                }
                chatMessages.appendChild(userDiv);

                const snapshot = await get(ref(db, `users/${currentUser.uid}/ai_chats/${currentChatId}/messages`));
                const data = snapshot.val();
                const history = [];
                if (data) {
                    const ids = Object.keys(data).sort((a, b) => data[a].timestamp - data[b].timestamp);
                    ids.forEach(id => history.push({ role: data[id].role, content: data[id].content }));
                }

                const msgDiv = document.createElement('div');
                msgDiv.className = 'message assistant';
                msgDiv.innerHTML = `<div class="msg-header">Nemesis AI</div><div class="assistant-content"></div><span class="cursor-blink"></span>`;
                chatMessages.appendChild(msgDiv);
                chatMessages.scrollTop = chatMessages.scrollHeight;

                const contentDiv = msgDiv.querySelector('.assistant-content');
                const cursorSpan = msgDiv.querySelector('.cursor-blink');

                let liveText = '';
                let renderScheduled = false;

                const scheduleRender = () => {
                    if (renderScheduled) return;
                    renderScheduled = true;
                    requestAnimationFrame(() => {
                        contentDiv.innerHTML = renderMessageContent(liveText);
                        chatMessages.scrollTop = chatMessages.scrollHeight;
                        renderScheduled = false;
                    });
                };

                const fullResponse = await streamAIResponse(history, imageUrl, roleClass, (chunk) => {
                    liveText += chunk;
                    scheduleRender();
                });

                if (cursorSpan) cursorSpan.remove();
                contentDiv.innerHTML = renderMessageContent(fullResponse);
                chatMessages.scrollTop = chatMessages.scrollHeight;

                const resRef = push(ref(db, `users/${currentUser.uid}/ai_chats/${currentChatId}/messages`));
                await set(resRef, { role: 'assistant', content: fullResponse, timestamp: Date.now() });

                clearFile();
                await loadUserChats();

            } catch (error) {
                console.error(error);
                const lastMsg = chatMessages.lastElementChild;
                if (lastMsg && lastMsg.classList.contains('assistant')) {
                    lastMsg.remove();
                }
                const errorDiv = document.createElement('div');
                errorDiv.className = 'message assistant error';
                errorDiv.innerHTML = `<div class="msg-header">Nemesis AI</div>❌ ${escapeHtml(error.message || 'Не удалось получить ответ')}`;
                chatMessages.appendChild(errorDiv);
                chatMessages.scrollTop = chatMessages.scrollHeight;
            } finally {
                sendBtn.disabled = false;
                isProcessing = false;
            }
        };

        // ===== СОСТОЯНИЕ =====
        onAuthStateChanged(auth, async (user) => {
            await updateUI(user);
        });

        // ===== ЗВЁЗДЫ =====
        function createStars() {
            const container = document.getElementById('stars');
            for (let i = 0; i < 120; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.width = (Math.random() * 2 + 1) + 'px';
                star.style.height = star.style.width;
                star.style.setProperty('--duration', (Math.random() * 3 + 2) + 's');
                star.style.animationDelay = (Math.random() * 5) + 's';
                container.appendChild(star);
            }
        }
        createStars();

        console.log('🚀 Nemesis AI готов к работе!');
        console.log('⭐ Создан командой Kotik Team');
        console.log('🔑 Используется прямой API Agnes');
    </script>
</body>
</html>
