<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nemesis AI — ИИ чат</title>
    <meta name="theme-color" content="#07070d" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #07070d;
            font-family: 'Inter', sans-serif;
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 20px;
        }

        #stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }
        .star {
            position: absolute;
            width: 2px;
            height: 2px;
            background: #fff;
            border-radius: 50%;
            opacity: 0.6;
            animation: twinkle var(--duration) ease-in-out infinite alternate;
        }
        @keyframes twinkle {
            0% { opacity: 0.2; transform: scale(0.8); }
            100% { opacity: 0.9; transform: scale(1.2); }
        }

        .container {
            width: 100%;
            max-width: 900px;
            position: relative;
            z-index: 5;
            display: flex;
            flex-direction: column;
            background: rgba(255,255,255,0.02);
            border-radius: 24px;
            border: 1px solid rgba(255,255,255,0.04);
            overflow: hidden;
            backdrop-filter: blur(10px);
            height: 92vh;
            max-height: 920px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 24px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            flex-shrink: 0;
            background: rgba(0,0,0,0.2);
        }
        .header .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 20px;
            font-weight: 800;
            color: #fff;
            text-decoration: none;
        }
        .header .logo .icon {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: linear-gradient(135deg, rgba(108,99,255,0.2), rgba(108,99,255,0.05));
            border: 1px solid rgba(108,99,255,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: #6c63ff;
        }
        .header .logo span.nemesis {
            background: linear-gradient(135deg, #6c63ff, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .header .logo .tag {
            font-size: 11px;
            font-weight: 400;
            color: #6c63ff;
            background: rgba(108,99,255,0.1);
            padding: 2px 12px;
            border-radius: 20px;
        }
        .header .back-btn {
            color: #8899bb;
            text-decoration: none;
            font-size: 13px;
            padding: 8px 18px;
            border-radius: 10px;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.05);
            transition: 0.3s;
        }
        .header .back-btn:hover { color: #fff; background: rgba(255,255,255,0.06); }

        .profile-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            background: rgba(255,255,255,0.03);
            border-bottom: 1px solid rgba(255,255,255,0.04);
            flex-shrink: 0;
        }
        .profile-bar .user {
            display: flex;
            align-items: center;
            gap: 12px;
            color: #8899bb;
            font-size: 13px;
        }
        .profile-bar .user .avatar {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: linear-gradient(135deg, #6c63ff, #a78bfa);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 700;
            color: #fff;
            flex-shrink: 0;
            box-shadow: 0 4px 16px rgba(108,99,255,0.2);
        }
        .profile-bar .user .name { color: #fff; font-weight: 600; }
        .profile-bar .role {
            font-size: 10px;
            padding: 3px 14px;
            border-radius: 20px;
            font-weight: 600;
            letter-spacing: 0.3px;
        }
        .profile-bar .role.free { background: rgba(255,255,255,0.05); color: #8888aa; }
        .profile-bar .role.elite { background: rgba(108,99,255,0.12); color: #6c63ff; }
        .profile-bar .role.ai_basic { background: rgba(108,99,255,0.15); color: #6c63ff; }
        .profile-bar .role.ai_max { background: rgba(255,215,0,0.12); color: #ffd700; }
        .profile-bar .role.nemesis { background: linear-gradient(135deg, rgba(255,215,0,0.2), rgba(255,215,0,0.05)); color: #ffd700; box-shadow: 0 0 30px rgba(255,215,0,0.05); }

        .chat-list {
            background: rgba(255,255,255,0.025);
            padding: 12px 20px;
            border-bottom: 1px solid rgba(255,255,255,0.04);
            flex-shrink: 0;
            max-height: 160px;
            overflow-y: auto;
        }
        .chat-list::-webkit-scrollbar { width: 4px; }
        .chat-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }
        .chat-list .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .chat-list .header span {
            color: #8888aa;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }
        .chat-list .header button {
            background: rgba(108,99,255,0.15);
            border: 1px solid rgba(108,99,255,0.15);
            color: #fff;
            padding: 4px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            font-family: 'Inter', sans-serif;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .chat-list .header button:hover { background: rgba(108,99,255,0.25); }

        .chat-items {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .chat-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px 6px 12px;
            border-radius: 20px;
            cursor: pointer;
            transition: 0.2s;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.04);
            font-size: 13px;
        }
        .chat-item:hover { background: rgba(108,99,255,0.05); border-color: rgba(108,99,255,0.08); }
        .chat-item.active { background: rgba(108,99,255,0.08); border-color: rgba(108,99,255,0.15); }
        .chat-item .title { color: #fff; max-width: 120px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .chat-item .count { color: #555566; font-size: 10px; background: rgba(255,255,255,0.03); padding: 0 8px; border-radius: 10px; }
        .chat-item .del-chat {
            color: #555566;
            cursor: pointer;
            font-size: 12px;
            transition: 0.2s;
        }
        .chat-item .del-chat:hover { color: #ff4455; }
        .chat-empty { color: #555566; font-size: 13px; padding: 6px 0; }

        .chat-window {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        .chat-messages {
            flex: 1;
            padding: 20px 24px;
            overflow-y: auto;
        }
        .chat-messages::-webkit-scrollbar { width: 6px; }
        .chat-messages::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.06); border-radius: 4px; }

        .chat-messages .empty {
            text-align: center;
            color: #555566;
            padding: 60px 0;
        }
        .chat-messages .empty .big-icon { font-size: 48px; margin-bottom: 12px; display: block; }
        .chat-messages .empty h3 { color: #fff; font-size: 20px; margin-bottom: 6px; }
        .chat-messages .empty p { font-size: 14px; }

        .message {
            padding: 12px 18px;
            border-radius: 14px;
            margin-bottom: 10px;
            max-width: 85%;
            font-size: 14px;
            line-height: 1.7;
            word-wrap: break-word;
            animation: messageIn 0.3s ease;
        }
        @keyframes messageIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .message.user {
            background: rgba(108,99,255,0.12);
            margin-left: auto;
            color: #fff;
            border-bottom-right-radius: 4px;
            border: 1px solid rgba(108,99,255,0.06);
        }
        .message.assistant {
            background: rgba(255,255,255,0.03);
            color: #ddd;
            border-bottom-left-radius: 4px;
            border: 1px solid rgba(255,255,255,0.03);
        }
        .message.assistant .msg-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 4px;
            font-weight: 600;
            color: #6c63ff;
            font-size: 12px;
        }
        .message.assistant .msg-header .star { color: #ffd700; }
        .message.assistant .msg-header .kotik { font-size: 11px; color: #8888aa; font-weight: 400; }
        .message.assistant.loading { opacity: 0.5; }
        .message.assistant.error { color: #ff4444; background: rgba(255,68,68,0.06); border-color: rgba(255,68,68,0.08); }
        .message .time {
            font-size: 10px;
            color: #555566;
            margin-top: 4px;
            display: block;
        }
        .message.user .time { text-align: right; }

        .chat-input-area {
            display: flex;
            gap: 10px;
            padding: 12px 20px;
            border-top: 1px solid rgba(255,255,255,0.04);
            flex-shrink: 0;
            background: rgba(0,0,0,0.1);
        }
        .chat-input-area input[type="text"] {
            flex: 1;
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 12px;
            padding: 12px 16px;
            color: #fff;
            font-size: 14px;
            outline: none;
            font-family: 'Inter', sans-serif;
        }
        .chat-input-area input[type="text"]::placeholder { color: #444466; }
        .chat-input-area input[type="text"]:focus { border-color: rgba(108,99,255,0.2); box-shadow: 0 0 30px rgba(108,99,255,0.02); }
        .chat-input-area .btn {
            background: rgba(108,99,255,0.12);
            border: 1px solid rgba(108,99,255,0.12);
            color: #fff;
            padding: 12px 18px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 16px;
            transition: 0.2s;
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .chat-input-area .btn:hover { background: rgba(108,99,255,0.2); }
        .chat-input-area .btn:disabled { opacity: 0.3; cursor: not-allowed; }

        .file-btn {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.06);
            color: #8899bb;
            padding: 12px 16px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 16px;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .file-btn:hover { background: rgba(255,255,255,0.06); color: #fff; }
        .file-preview {
            padding: 6px 12px;
            background: rgba(255,255,255,0.02);
            border-radius: 8px;
            font-size: 12px;
            color: #8888aa;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-basis: 100%;
        }
        .file-preview img { max-height: 30px; border-radius: 4px; }
        .file-preview .remove-file { color: #ff4455; cursor: pointer; font-weight: 700; }

        .login-box {
            background: rgba(255,255,255,0.02);
            border-radius: 24px;
            border: 1px solid rgba(255,255,255,0.05);
            padding: 40px;
            max-width: 420px;
            margin: 40px auto;
            text-align: center;
            backdrop-filter: blur(20px);
        }
        .login-box .login-icon { font-size: 48px; margin-bottom: 12px; color: #6c63ff; }
        .login-box h2 { font-size: 24px; margin-bottom: 4px; }
        .login-box .sub { color: #8888aa; font-size: 13px; margin-bottom: 24px; }
        .login-box input {
            width: 100%;
            padding: 14px 18px;
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 12px;
            color: #fff;
            font-size: 14px;
            outline: none;
            font-family: 'Inter', sans-serif;
            margin-bottom: 12px;
        }
        .login-box input:focus { border-color: rgba(108,99,255,0.2); }
        .login-box input::placeholder { color: #444466; }
        .login-box .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, rgba(108,99,255,0.15), rgba(108,99,255,0.05));
            border: 1px solid rgba(108,99,255,0.15);
            border-radius: 60px;
            color: #fff;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: 0.3s;
            font-family: 'Inter', sans-serif;
        }
        .login-box .btn:hover { background: rgba(108,99,255,0.2); box-shadow: 0 8px 32px rgba(108,99,255,0.05); }
        .login-box .toggle {
            margin-top: 14px;
            font-size: 13px;
            color: #8888aa;
        }
        .login-box .toggle span { color: #6c63ff; cursor: pointer; font-weight: 600; }
        .login-box .status { margin-top: 12px; font-size: 13px; min-height: 20px; color: #8888aa; }
        .hidden { display: none !important; }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(11,11,18,0.95);
            color: #fff;
            padding: 12px 32px;
            border-radius: 60px;
            border: 1px solid rgba(108,99,255,0.12);
            font-size: 13px;
            font-weight: 500;
            z-index: 9999;
            backdrop-filter: blur(12px);
            box-shadow: 0 8px 40px rgba(0,0,0,0.6);
            animation: toastIn 0.4s ease;
            text-align: center;
            max-width: 90%;
        }
        .toast.fade-out { opacity: 0; transition: opacity 0.4s ease; }
        @keyframes toastIn {
            from { opacity: 0; transform: translateX(-50%) translateY(20px) scale(0.95); }
            to { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
        }

        @media (max-width: 600px) {
            .header .logo { font-size: 17px; }
            .chat-messages { padding: 16px; }
            .chat-input-area { padding: 10px 16px; flex-wrap: wrap; }
            .chat-input-area input[type="text"] { min-width: 100px; }
            .chat-list { max-height: 120px; padding: 10px 16px; }
            .chat-items { gap: 6px; }
            .chat-item { font-size: 12px; padding: 4px 10px; }
            .login-box { padding: 24px; margin: 20px; }
            .profile-bar { flex-wrap: wrap; gap: 8px; }
        }
    </style>
</head>
<body>

    <div id="stars"></div>

    <div class="container">

        <!-- ХЕДЕР -->
        <div class="header">
            <a href="/" class="logo">
                <div class="icon">N</div>
                <span class="nemesis">NEMESIS</span>
                <span class="tag">AI</span>
            </a>
            <a href="/" class="back-btn"><i class="fas fa-arrow-left"></i> На главную</a>
        </div>

        <div id="main-content" style="display:flex; flex-direction:column; flex:1; min-height:0;">

            <!-- НЕ АВТОРИЗОВАН -->
            <div id="login-section" style="display:flex; align-items:center; justify-content:center; flex:1;">
                <div class="login-box">
                    <div class="login-icon"><i class="fas fa-robot"></i></div>
                    <h2 id="form-title">Добро пожаловать</h2>
                    <div class="sub" id="form-subtitle">Войдите в свой аккаунт Nemesis</div>
                    <form id="auth-form" onsubmit="handleAuth(event)">
                        <div id="reg-fields" class="hidden">
                            <input type="text" id="reg-username" placeholder="Имя пользователя" autocomplete="off" />
                        </div>
                        <input type="email" id="auth-email" placeholder="Email" required autocomplete="email" />
                        <input type="password" id="auth-pass" placeholder="Пароль" required autocomplete="current-password" />
                        <div id="reg-pass-repeat" class="hidden">
                            <input type="password" id="auth-pass-repeat" placeholder="Повторите пароль" autocomplete="new-password" />
                        </div>
                        <button type="submit" class="btn" id="auth-btn">Войти</button>
                    </form>
                    <div class="toggle"><span id="toggle-link">Нет аккаунта? Зарегистрироваться</span></div>
                    <div class="status" id="auth-status"></div>
                </div>
            </div>

            <!-- АВТОРИЗОВАН -->
            <div id="chat-section" class="hidden" style="display:flex; flex-direction:column; flex:1; min-height:0;">

                <!-- ПРОФИЛЬ -->
                <div class="profile-bar">
                    <div class="user">
                        <div class="avatar" id="user-avatar">👤</div>
                        <span class="name" id="user-name">Пользователь</span>
                    </div>
                    <span class="role" id="user-role">FREE</span>
                    <button onclick="logout()" style="background:rgba(255,0,0,0.05); border:1px solid rgba(255,0,0,0.08); color:#ff4455; padding:4px 14px; border-radius:8px; cursor:pointer; font-size:11px; font-family:'Inter',sans-serif;">Выйти</button>
                </div>

                <!-- СПИСОК ЧАТОВ -->
                <div class="chat-list">
                    <div class="header">
                        <span><i class="far fa-comment-dots" style="margin-right:6px;"></i> Чаты</span>
                        <button onclick="createNewChat()"><i class="fas fa-plus"></i> Новый</button>
                    </div>
                    <div class="chat-items" id="chat-list-items">
                        <div class="chat-empty">Нет чатов</div>
                    </div>
                </div>

                <!-- ОКНО ЧАТА -->
                <div class="chat-window">
                    <div class="chat-messages" id="chat-messages">
                        <div class="empty">
                            <span class="big-icon">🤖</span>
                            <h3>Nemesis AI ⭐</h3>
                            <p>Начните новый чат или выберите существующий</p>
                        </div>
                    </div>

                    <div class="chat-input-area">
                        <input id="chat-input" type="text" placeholder="Напиши сообщение..." onkeydown="if(event.key==='Enter') sendMessage()">
                        <label for="file-input" class="file-btn" title="Загрузить изображение"><i class="fas fa-paperclip"></i></label>
                        <input type="file" id="file-input" accept="image/*" style="display:none">
                        <button class="btn" id="send-btn" onclick="sendMessage()"><i class="fas fa-paper-plane"></i></button>
                        <div id="file-preview" class="file-preview hidden"></div>
                    </div>
                </div>

            </div>

        </div>

    </div>

        // ===== ТОСТ =====
        function showToast(message, icon = '✨') {
            const existing = document.querySelector('.toast');
            if (existing) existing.remove();
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.innerHTML = `<span>${icon}</span> ${message}`;
            document.body.appendChild(toast);
            setTimeout(() => {
                toast.classList.add('fade-out');
                setTimeout(() => toast.remove(), 500);
            }, 3000);
        }

        // ===== ПОКАЗАТЬ/СКРЫТЬ =====
        function showLogin() {
            loginSection.style.display = 'flex';
            chatSection.style.display = 'none';
        }

        function showChat() {
            loginSection.style.display = 'none';
            chatSection.style.display = 'flex';
        }

        // ===== ПРАВА =====
        function getUserPermissions(role) {
            const base = {
                canChat: true,
                canUseVision: false,
                maxTokens: 500,
                model: AI_MODEL,
                provider: 'kodikrouter',
                label: '🆓 FREE'
            };

            switch (role) {
                case 'nemesis':
                    return { ...base, canUseVision: true, maxTokens: 4000, label: '👑 NEMESIS' };
                case 'ai_max':
                    return { ...base, canUseVision: true, maxTokens: 4000, label: '🚀 AI MAX' };
                case 'ai_basic':
                    return { ...base, canUseVision: true, maxTokens: 2000, label: '🧠 AI+' };
                case 'elite':
                    return { ...base, label: '⚡ ELITE' };
                default:
                    return base;
            }
        }

        // ===== ЗАГРУЗКА ФОТО =====
        async function uploadImage(file) {
            const formData = new FormData();
            formData.append('image', file);
            const response = await fetch('https://api.imgbb.com/1/upload?key=4d5f7c8e9a0b1c2d3e4f5g6h7i8j9k0l', {
                method: 'POST',
                body: formData
            });
            const data = await response.json();
            if (data.success) return data.data.url;
            throw new Error('Ошибка загрузки фото');
        }

        // ===== ОТПРАВКА В KODIKROUTER =====
        async function callKodikRouterAI(messages, maxTokens, imageUrl = null) {
            const systemMessage = {
                role: 'system',
                content: `Ты — Nemesis AI ⭐, умный и дружелюбный искусственный интеллект, созданный командой Kotik Team. Ты помогаешь пользователям с любыми вопросами: программирование, учёба, творчество, анализ данных. Отвечаешь кратко, понятно и с душой. Всегда представляешься как "Nemesis AI ⭐" в начале общения, если пользователь спрашивает кто ты. Ты — часть экосистемы NEMESIS :3. Отвечай на русском языке.`
            };

            let formattedMessages = [systemMessage, ...messages];
            
            if (imageUrl) {
                const lastMsg = messages[messages.length - 1];
                formattedMessages = [
                    systemMessage,
                    ...messages.slice(0, -1),
                    {
                        role: 'user',
                        content: [
                            { type: 'text', text: lastMsg.content },
                            { type: 'image_url', image_url: { url: imageUrl } }
                        ]
                    }
                ];
            }

            const response = await fetch(KODIKROUTER_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${KODIKROUTER_KEY}`
                },
                body: JSON.stringify({
                    model: AI_MODEL,
                    messages: formattedMessages,
                    max_tokens: maxTokens,
                    temperature: 0.7
                })
            });

            if (!response.ok) {
                const errorData = await response.json();
                throw new Error(errorData.error?.message || 'Ошибка KodikRouter API');
            }

            const data = await response.json();
            return data.choices[0].message.content;
        }

        // ===== ГЛАВНАЯ ФУНКЦИЯ =====
        async function getAIResponse(messages, role, imageUrl = null) {
            const perms = getUserPermissions(role);
            try {
                return await callKodikRouterAI(messages, perms.maxTokens, imageUrl);
            } catch (error) {
                console.error('AI Error:', error);
                throw error;
            }
        }

        // ===== АВТОРИЗАЦИЯ =====
        async function updateUI(user) {
            if (user) {
                try {
                    const snapshot = await get(ref(db, `users/${user.uid}`));
                    let data = snapshot.exists() ? snapshot.val() : {};
                    if (!data.role) {
                        const userData = {
                            username: user.displayName || user.email.split('@')[0],
                            email: user.email,
                            role: 'free',
                            createdAt: new Date().toISOString(),
                            ai_chats: {}
                        };
                        await set(ref(db, `users/${user.uid}`), userData);
                        data = userData;
                    }

                    currentUser = user;
                    userName.textContent = data.username || user.displayName || user.email.split('@')[0];
                    userAvatar.textContent = (data.username || 'U')[0].toUpperCase();

                    const role = data.role || 'free';
                    const perms = getUserPermissions(role);
                    userRole.textContent = perms.label;
                    userRole.className = 'role ' + role;

                    showChat();
                    loadUserChats();
                } catch (error) {
                    console.error('Ошибка загрузки:', error);
                }
            } else {
                currentUser = null;
                showLogin();
                authStatus.textContent = '';
            }
        }

        window.handleAuth = async function(event) {
            event.preventDefault();
            const email = authEmail.value.trim();
            const password = authPass.value;
            authStatus.textContent = '⏳ Обработка...';
            authStatus.style.color = '#8888aa';

            try {
                if (isLoginMode) {
                    const userCredential = await signInWithEmailAndPassword(auth, email, password);
                    await updateUI(userCredential.user);
                    authForm.reset();
                    showToast('Добро пожаловать!', '👋');
                } else {
                    const username = regUsername.value.trim();
                    const passwordRepeat = authPassRepeat.value;
                    if (!username || username.length < 3) {
                        authStatus.textContent = '❌ Имя не менее 3 символов!';
                        authStatus.style.color = '#ff4444';
                        return;
                    }
                    if (password.length < 6) {
                        authStatus.textContent = '❌ Пароль не менее 6 символов!';
                        authStatus.style.color = '#ff4444';
                        return;
                    }
                    if (password !== passwordRepeat) {
                        authStatus.textContent = '❌ Пароли не совпадают!';
                        authStatus.style.color = '#ff4444';
                        return;
                    }

                    const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                    const user = userCredential.user;
                    await updateProfile(user, { displayName: username });

                    await set(ref(db, `users/${user.uid}`), {
                        username: username,
                        email: email,
                        role: "free",
                        createdAt: new Date().toISOString(),
                        ai_chats: {}
                    });

                    await updateUI(user);
                    authForm.reset();
                    showToast('Аккаунт создан!', '🎉');
                }
            } catch (error) {
                console.error(error);
                let msg = '❌ Ошибка! ';
                switch (error.code) {
                    case 'auth/email-already-in-use': msg += 'Email уже используется.'; break;
                    case 'auth/invalid-email': msg += 'Некорректный email.'; break;
                    case 'auth/user-not-found': msg += 'Пользователь не найден. Зарегистрируйтесь!'; break;
                    case 'auth/wrong-password': msg += 'Неверный пароль.'; break;
                    case 'auth/weak-password': msg += 'Слабый пароль (мин. 6 символов).'; break;
                    default: msg += error.message;
                }
                authStatus.textContent = msg;
                authStatus.style.color = '#ff4444';
            }
        };

        toggleLink.addEventListener('click', () => {
            isLoginMode = !isLoginMode;
            if (isLoginMode) {
                formTitle.textContent = 'Добро пожаловать';
                formSubtitle.textContent = 'Войдите в свой аккаунт Nemesis';
                authBtn.textContent = 'Войти';
                toggleLink.textContent = 'Нет аккаунта? Зарегистрироваться';
                regFields.classList.add('hidden');
                regPassRepeat.classList.add('hidden');
                authEmail.placeholder = 'Email';
            } else {
                formTitle.textContent = 'Создать аккаунт';
                formSubtitle.textContent = 'Присоединяйся к Nemesis';
                authBtn.textContent = 'Зарегистрироваться';
                toggleLink.textContent = 'Уже есть аккаунт? Войти';
                regFields.classList.remove('hidden');
                regPassRepeat.classList.remove('hidden');
                authEmail.placeholder = 'Email (для входа)';
            }
            authStatus.textContent = '';
        });

        window.logout = async function() {
            try {
                await signOut(auth);
                await updateUI(null);
                showToast('Вы вышли из аккаунта', '👋');
            } catch (error) {
                console.error(error);
            }
        };

        // ===== ФАЙЛЫ =====
        fileInput.addEventListener('change', function(e) {
            const file = this.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    filePreview.innerHTML = `
                        <img src="${event.target.result}" alt="preview">
                        <span>${file.name}</span>
                        <span class="remove-file" onclick="clearFile()">✕</span>
                    `;
                    filePreview.classList.remove('hidden');
                };
                reader.readAsDataURL(file);
            }
        });

        window.clearFile = function() {
            fileInput.value = '';
            filePreview.innerHTML = '';
            filePreview.classList.add('hidden');
            currentImageUrl = null;
        };

        // ===== УДАЛЕНИЕ ЧАТА =====
        window.deleteChat = async function(chatId, e) {
            e.stopPropagation();
            if (!currentUser) return;
            if (!confirm('Удалить этот чат?')) return;
            
            try {
                await remove(ref(db, `users/${currentUser.uid}/ai_chats/${chatId}`));
                if (currentChatId === chatId) {
                    currentChatId = null;
                    chatMessages.innerHTML = `<div class="empty"><span class="big-icon">🤖</span><h3>Nemesis AI ⭐</h3><p>Начните новый чат или выберите существующий</p></div>`;
                }
                await loadUserChats();
                showToast('Чат удалён', '🗑️');
            } catch (error) {
                console.error(error);
                showToast('Ошибка удаления', '❌');
            }
        };

        // ===== ЧАТЫ =====
        async function loadUserChats() {
            if (!currentUser) return;
            try {
                const snapshot = await get(ref(db, `users/${currentUser.uid}/ai_chats`));
                const data = snapshot.val();
                chatListItems.innerHTML = '';
                if (!data || Object.keys(data).length === 0) {
                    chatListItems.innerHTML = '<div class="chat-empty">Нет чатов</div>';
                    return;
                }
                const ids = Object.keys(data).sort((a, b) => data[b].updated_at?.localeCompare(data[a].updated_at) || 0);
                ids.forEach(id => {
                    const chat = data[id];
                    const div = document.createElement('div');
                    div.className = 'chat-item' + (currentChatId === id ? ' active' : '');
                    div.innerHTML = `
                        <span class="title">${chat.title || 'Новый чат'}</span>
                        <span class="count">${chat.messages ? Object.keys(chat.messages).length : 0}</span>
                        <span class="del-chat" onclick="deleteChat('${id}', event)"><i class="fas fa-times"></i></span>
                    `;
                    div.onclick = () => openChat(id);
                    chatListItems.appendChild(div);
                });
            } catch (error) {
                console.error(error);
            }
        }

        async function openChat(chatId) {
            if (!currentUser) return;
            currentChatId = chatId;
            try {
                const snapshot = await get(ref(db, `users/${currentUser.uid}/ai_chats/${chatId}`));
                const data = snapshot.val();
                if (!data) return;
                chatMessages.innerHTML = '';
                if (data.messages) {
                    const ids = Object.keys(data.messages).sort((a, b) => data.messages[a].timestamp - data.messages[b].timestamp);
                    ids.forEach(id => {
                        const msg = data.messages[id];
                        const div = document.createElement('div');
                        div.className = `message ${msg.role}`;
                        const time = new Date(msg.timestamp).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
                        if (msg.role === 'assistant') {
                            div.innerHTML = `
                                <div class="msg-header">
                                    <span class="star">⭐</span> Nemesis AI
                                    <span class="kotik">· Kotik Team</span>
                                </div>
                                ${msg.content}
                                <span class="time">${time}</span>
                            `;
                        } else {
                            div.innerHTML = `
                                ${msg.content}
                                <span class="time">${time}</span>
                            `;
                        }
                        chatMessages.appendChild(div);
                    });
                } else {
                    chatMessages.innerHTML = `<div class="empty"><span class="big-icon">🤖</span><h3>Нет сообщений</h3><p>Напишите что-нибудь</p></div>`;
                }
                chatMessages.scrollTop = chatMessages.scrollHeight;
                document.querySelectorAll('.chat-item').forEach(el => el.classList.remove('active'));
                const items = document.querySelectorAll('.chat-item');
                const index = Array.from(items).findIndex(el => el.onclick && el.onclick.toString().includes(chatId));
                if (index !== -1 && items[index]) items[index].classList.add('active');
            } catch (error) {
                console.error(error);
            }
        }

        window.createNewChat = async function() {
            if (!currentUser) return;
            try {
                const chatId = `chat_${Date.now()}`;
                await set(ref(db, `users/${currentUser.uid}/ai_chats/${chatId}`), {
                    title: 'Новый чат',
                    created_at: new Date().toISOString(),
                    updated_at: new Date().toISOString(),
                    messages: {}
                });
                await loadUserChats();
                await openChat(chatId);
                showToast('Новый чат создан', '📝');
            } catch (error) {
                console.error(error);
                showToast('Ошибка создания чата', '❌');
            }
        };

        window.sendMessage = async function() {
            const text = chatInput.value.trim();
            if (!text || !currentUser || !currentChatId || isProcessing) {
                if (!currentUser) showToast('Войдите в аккаунт', '🔒');
                return;
            }

            const userSnapshot = await get(ref(db, `users/${currentUser.uid}`));
            const userData = userSnapshot.val();
            const role = userData.role || 'free';
            const perms = getUserPermissions(role);

            if (!perms.canChat) {
                showToast('❌ У вас нет прав на использование ИИ. Купите тариф!', '🚫');
                return;
            }

            const file = fileInput.files[0];
            let imageUrl = currentImageUrl;
            if (file && !perms.canUseVision) {
                showToast('❌ Ваш тариф не поддерживает загрузку фото. Купите AI+ или AI MAX!', '📸');
                return;
            }

            if (file && !imageUrl) {
                try {
                    imageUrl = await uploadImage(file);
                    currentImageUrl = imageUrl;
                } catch (error) {
                    showToast('Ошибка загрузки фото: ' + error.message, '❌');
                    return;
                }
            }

            chatInput.value = '';
            sendBtn.disabled = true;
            isProcessing = true;

            try {
                const msgRef = push(ref(db, `users/${currentUser.uid}/ai_chats/${currentChatId}/messages`));
                await set(msgRef, { role: 'user', content: text, timestamp: Date.now() });
                await update(ref(db, `users/${currentUser.uid}/ai_chats/${currentChatId}`), { updated_at: new Date().toISOString() });

                const snapshot = await get(ref(db, `users/${currentUser.uid}/ai_chats/${currentChatId}/messages`));
                const data = snapshot.val();
                const history = [];
                if (data) {
                    const ids = Object.keys(data).sort((a, b) => data[a].timestamp - data[b].timestamp);
                    ids.forEach(id => {
                        history.push({ role: data[id].role, content: data[id].content });
                    });
                }

                const loadingDiv = document.createElement('div');
                loadingDiv.className = 'message assistant loading';
                loadingDiv.innerHTML = `<div class="msg-header"><span class="star">⭐</span> Nemesis AI</div>Думаю...`;
                chatMessages.appendChild(loadingDiv);
                chatMessages.scrollTop = chatMessages.scrollHeight;

                const response = await getAIResponse(history, role, imageUrl);

                if (loadingDiv.parentNode) loadingDiv.remove();

                const resRef = push(ref(db, `users/${currentUser.uid}/ai_chats/${currentChatId}/messages`));
                await set(resRef, { role: 'assistant', content: response, timestamp: Date.now() });

                clearFile();
                currentImageUrl = null;

                await openChat(currentChatId);
                await loadUserChats();

            } catch (error) {
                console.error(error);
                const loading = chatMessages.querySelector('.message.assistant.loading');
                if (loading) loading.remove();

                const errorDiv = document.createElement('div');
                errorDiv.className = 'message assistant error';
                errorDiv.innerHTML = `<div class="msg-header"><span class="star">⭐</span> Nemesis AI</div>❌ ${error.message || 'Не удалось получить ответ'}`;
                chatMessages.appendChild(errorDiv);
                chatMessages.scrollTop = chatMessages.scrollHeight;
            } finally {
                sendBtn.disabled = false;
                isProcessing = false;
            }
        };

        // ===== СОСТОЯНИЕ =====
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                await updateUI(user);
            } else {
                await updateUI(null);
            }
        });

        // ===== ЗВЁЗДЫ =====
        function createStars() {
            const container = document.getElementById('stars');
            for (let i = 0; i < 120; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.width = (Math.random() * 2 + 1) + 'px';
                star.style.height = star.style.width;
                star.style.setProperty('--duration', (Math.random() * 3 + 2) + 's');
                star.style.animationDelay = (Math.random() * 5) + 's';
                container.appendChild(star);
            }
        }
        createStars();

        console.log('🚀 Nemesis AI — обновлённый дизайн!');
        console.log('⭐ Создан командой Kotik Team');
        console.log('🤖 Модель: Google Gemma 4 31B (KodikRouter)');
    </script>
</body>
